l_english:

 # Anglo-Saxon events
 conquest_flavour_anglosaxon.0002.t: "The Unification of [GetGeographicalRegion('btwk_custom_aengland').GetNameNoTooltip]"
 conquest_flavour_anglosaxon.0002.desc: "The Anglo-Saxons have always been a divided people. Even their ancestors on the continent had little unity between their many tribes, and when they arrived in Britannia, the Anglo-Saxons consolidated into a number of competing kingdoms rather than uniting together. But now, this era of division is approaching an end, as [conqueror.GetName] has conquered all of the other all kingdoms to unite all of [GetGeographicalRegion('btwk_custom_aengland').GetName] under [conqueror.GetHerHis] rule, from the cliffs of [GetTitleByKey('b_portus_dubriscity').GetNameNoTierNoTooltip] to the coasts of [GetTitleByKey('d_anglelothian').GetNameNoTierNoTooltip]. Never before has a single [conqueror.Custom('GetQueenKing')|l] ruled over all the Anglo-Saxons, or controlled so much of Britannia since the Roman withdrawal centuries ago. If [conqueror.GetSheHe] can resist the pressures of localist sentiment that have felled would-be unifiers before, [conqueror.GetSheHe] and [conqueror.GetHerHis] heirs may finally be able to forge [conqueror.GetHerHis] conquests into a united [GetTitleByKey('e_aengland').GetAdjectiveNoTooltip] kingdom that will be the envy of all the Isles."
 conquest_flavour_anglosaxon.0002.a.conqueror: "I am King of all the Anglo-Saxons."
 conquest_flavour_anglosaxon.0002.a.conqueror_vassal: "Glory to the [conqueror.GetTitleAsNameNoTooltip]!"
 conquest_flavour_anglosaxon.0002.a.briton_roman: "Is there anything we can do to stop them now?"
 conquest_flavour_anglosaxon.0002.a: "This is interesting news..."

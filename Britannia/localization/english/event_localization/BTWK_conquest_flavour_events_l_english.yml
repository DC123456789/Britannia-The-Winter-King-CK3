 conquest_flavour_anglosaxon.0004.t: "The Conquest of [GetGeographicalRegion('btwk_world_britannia').GetNameNoTooltip]"
 conquest_flavour_anglosaxon.0004.desc: "The dream of Hengist and Horsa has been fulfilled - through treachery, intermarriage, and conquest, [conqueror.GetName] now rules over all of the old province of Britannia, from the German Sea in the east to the Irish Sea in the west. Their fierce resistance undone by their eternal bane of division, the Britons are again a conquered people in their ancient homeland, chafing under the rule of their Germanic overlords.\n\nThe ambitions of the [GetTitleByKey('e_aengland').GetAdjectiveNoTooltip] are unlikely to be satisfied finishing the conquest of Britannia - already there are reports of [GetTitleByKey('e_aengland').GetAdjectiveNoTooltip] scouts monitoring the Pictish border and exploring the Irish coasts. It may not be long before all of the British Isles and beyond fall under the Saxon yoke."
 conquest_flavour_anglosaxon.0004.a.s: "No longer just Britannia, but now and truly the land of the [GetTitleByKey('e_aengland').GetAdjectiveNoTooltip]."
 conquest_flavour_anglosaxon.0004.a.conqueror_vassal: "Glory to the [conqueror.GetTitleAsNameNoTooltip]!"
 conquest_flavour_anglosaxon.0004.a.conqueror: "One day, our prophesied son will come, and Britannia will be ours again!"
 conquest_flavour_anglosaxon.0004.a: "This is interesting news..."
 

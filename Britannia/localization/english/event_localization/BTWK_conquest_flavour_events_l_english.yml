 # Briton events
 conquest_flavour_briton.0002.t: "The Reconquest of [GetGeographicalRegion('btwk_world_britannia_south_lloegyr').GetNameNoTooltip]"
 conquest_flavour_briton.0002.t.total_defeat: "Defeat of the Anglo-Saxons"      # Could be fancier?
 conquest_flavour_briton.0002.desc: "The cities of [GetGeographicalRegion('btwk_world_britannia_south_lloegyr').GetName] along the old Saxon Shore were the first to fall the Saxons. From there, they settled westwards along the coasts and rivers, and under [aelle_of_anglia.GetFirstName] and other powerful warlord-kings they overran the British kingdoms of the midlands and pushed deep into the heart of Britannia. But the British hardened their resolve, first stopping and then reversing the course of the Anglo-Saxon conquests, reconquering their lost lands and eventually pushing the Saxons all the way back to the sea from where they came. With the fall of the last Saxon kingdom in the south, [GetGeographicalRegion('btwk_world_britannia_south_lloegyr').GetNameNoTooltip] now lies free and restored to British rule, the remaining Saxons subjugated under the Britons they once hoped to conquer. While Saxon kings still rule in and threaten the north, it may be only a matter of time before they meet the same fate as their southern cousins."
 conquest_flavour_briton.0002.desc.non_briton_controlling_culture: "The cities of [GetGeographicalRegion('btwk_world_britannia_south_lloegyr').GetName], lying along the old Saxon Shore, were the first to fall the Saxons. From there, they settled westwards along the coasts and rivers, and under [aelle_of_anglia.GetFirstName] and other powerful warlord-kings they overran the British kingdoms of the midlands and pushed deep into the heart of Britannia. But they had not reckoned on the rise of the [southern_britannia_largest_controlled_culture.GetCollectiveNounNoTooltip], who first stopped and then reversed the course of the Anglo-Saxon conquests, eventually pushing all the way to the Saxon heartlands in the east. With the fall of the last Saxon kingdom in the south, [GetGeographicalRegion('btwk_world_britannia_south_lloegyr').GetNameNoTooltip] now lies free from Saxon rule, with those remaining now subjugated under the [southern_britannia_largest_controlled_culture.GetCollectiveNounNoTooltip]. While Saxon kings still rule in and threaten the north, it may be only a matter of time before they meet the same fate as their southern cousins."
 conquest_flavour_briton.0002.desc.total_defeat: "The cities of [GetGeographicalRegion('btwk_world_britannia_south_lloegyr').GetName] along the old Saxon Shore were the first to fall the Saxons. From there, they settled westwards along the coasts and rivers, and under [aelle_of_anglia.GetFirstName] and other powerful warlord-kings they made great conquests deep into the heart of Britannia. But the British hardened their resolve, reconquering their lost lands and pushing the Saxons all the way back to the sea from where they came. With the fall of the last Saxon kingdom, all of Britannia now lies restored to British rule, the remaining Saxons subjugated under the Britons they once hoped to conquer. The dream of an Anglo-Saxon [GetTitleByKey('e_aengland').GetNameNoTierNoTooltip] is dead, and no longer will the Britons live in fear of foreign invasions - though there are those who still carefully watch the Oceanus Germanicus, ever wary that one day, warhosts will land on the eastern shore of Britannia once more..."
 conquest_flavour_briton.0002.desc.total_defeat.non_briton_controlling_culture: "The cities of [GetGeographicalRegion('btwk_world_britannia_south_lloegyr').GetName] along the old Saxon Shore were the first to fall the Saxons. From there, they settled westwards along the coasts and rivers, and under [aelle_of_anglia.GetFirstName] and other powerful warlord-kings they made great conquests deep into the heart of Britannia. But they had not reckoned on the rise of the [southern_britannia_largest_controlled_culture.GetCollectiveNounNoTooltip], stopping the conquest in its tracks and eventually pushing all the way to the Saxon heartlands in the east. With the fall of the last Saxon kingdom in the south, Britannia now lies free from Saxon rule, with those remaining now subjugated under the [southern_britannia_largest_controlled_culture.GetCollectiveNounNoTooltip]. The dream of an Anglo-Saxon [GetTitleByKey('e_aengland').GetNameNoTierNoTooltip] is dead, and no longer will Britannia live in fear of invasion - though there are those who still carefully watch the Oceanus Germanicus, ever wary that one day, warhosts will land on the eastern shore of Britannia once more..."
 conquest_flavour_briton.0002.a.briton_roman: "The south is free!"
 conquest_flavour_briton.0002.a.briton_roman.total_defeat: "The Adventus is over - we have won, and Britannia is free."
 conquest_flavour_briton.0002.a.anglosaxon: "But still the north holds - we will avenge our defeats!"
 conquest_flavour_briton.0002.a.anglosaxon.total_defeat: "Mark my words...! We will rise again!"
 conquest_flavour_briton.0002.a.norse_total_defeat: "Pathetic. Let's show them how it's done..."
 conquest_flavour_briton.0002.a: "This is interesting news..."
 conquest_flavour_briton.0003.t: "Defeat of the Northumbrians"      # Not sure about this
 conquest_flavour_briton.0003.t.total_defeat: "Defeat of the Anglo-Saxons"
 conquest_flavour_briton.0003.desc: "At first, there was relatively little Anglo-Saxon presence in [GetGeographicalRegion('btwk_world_britannia_hen_ogledd').GetName], but that would change with the rise of ambitious Angle warlords who attempted to claim the coast for themselves and found new kingdoms to call their own. These Northumbrians would pose a significant threat to the kingdoms of the North, but were ultimately unable to prevail against the Britons who eventually pushed them back to the sea from where they came. With the fall of the last Saxon kingdom in the North of the Humber, the North now lies fully restored to British rule, the remaining Saxons now subjugated under the Britons they once hoped to conquer. While Saxon kings still rule in and threaten the south, the strength of a reinvigorated Briton north may well be enough to ensure that they eventually meet the same fate as their northern cousins."
 conquest_flavour_briton.0003.desc.non_briton_controlling_culture: "At first, there was relatively little Anglo-Saxon presence in [GetGeographicalRegion('btwk_world_britannia_hen_ogledd').GetName], but that soon changed with the rise of ambitious Angle warlords who attempted to claim the coast for themselves and found new kingdoms to call their own. These Northumbrians at one point posed a significant threat to the kingdoms of the North, but were ultimately unable to prevail against the rising [northern_britannia_largest_controlled_culture.GetCollectiveNounNoTooltip] who eventually pushed them back to the sea from where they came. With the fall of the last Saxon kingdom in the North of the Humber, the North now lies free from Saxon rule, with those remaining now under the [northern_britannia_largest_controlled_culture.GetCollectiveNounNoTooltip]. While Saxon kings still rule in and threaten the south, the strength of a reinvigorated [northern_britannia_largest_controlled_culture.GetNameNoTooltip] North may well be enough to ensure that they eventually meet the same fate as their northern cousins."
 conquest_flavour_briton.0003.desc.total_defeat: "At first, there was relatively little Anglo-Saxon presence in [GetGeographicalRegion('btwk_world_britannia_hen_ogledd').GetName], but that would change with the rise of ambitious Angle warlords who attempted to claim the coast for themselves. These Northumbrians made significant advances but were ultimately unable to prevail against the Britons who, as in the south, eventually pushed them back to the sea from where they came. Now, with the fall of the last Saxon kingdom, all of Britannia lies restored to British rule, the remaining Saxons subjugated under the Britons they once hoped to conquer. The dream of an Anglo-Saxon [GetTitleByKey('e_aengland').GetNameNoTierNoTooltip] is dead, and no longer will the Britons live in fear of foreign invasions - though there are those who still carefully watch the Oceanus Germanicus, ever wary that one day, warhosts will land on the eastern shore of Britannia once more..."
 conquest_flavour_briton.0003.desc.total_defeat.non_briton_controlling_culture: "At first, there was relatively little Anglo-Saxon presence in [GetGeographicalRegion('btwk_world_britannia_hen_ogledd').GetName], but that would change with the rise of ambitious Angle warlords who attempted to claim the coast for themselves. These Northumbrians made significant advances but were ultimately unable to prevail against rising [northern_britannia_largest_controlled_culture.GetCollectiveNounNoTooltip] who, as in the south, eventually pushed them back to the sea from where they came. Now, with the fall of the last Saxon kingdom, all of Britannia lies free from Saxon rule, with those remaining subjugated under the [northern_britannia_largest_controlled_culture.GetCollectiveNounNoTooltip]. The dream of an Anglo-Saxon [GetTitleByKey('e_aengland').GetNameNoTierNoTooltip] is dead, and no longer will Britannia live in fear of invasion - though there are those who still carefully watch the Oceanus Germanicus, ever wary that one day, warhosts will land on the eastern shore of Britannia once more..."

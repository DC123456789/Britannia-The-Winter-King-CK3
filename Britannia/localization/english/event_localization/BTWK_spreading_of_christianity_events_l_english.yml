l_english:
 spreading_of_christianity.0001.t: "The Spreading of Christianity"
 spreading_of_christianity.0001.desc.christian: "Praise the Lord and His Saints! While the last few decades have been turbulent indeed, the church has persevered as it always has and the faith has never been stronger. From Ireland to India the hard work of missionaries continues to spread the Word of God to ever more peoples who have not yet had the fortune to hear the good news. \n\nWith every passing day the church grows as more and more worshippers enter the faith, whether it be converts in still-pagan rural areas or entirely new peoples at the frontier of civilization. Surely it is only a matter of time before the whole world comes under the loving bosom of the Lord!"
 spreading_of_christianity.0001.desc.hellenic: "The Christians are spreading like a plague across Europe. Followers of the old religions are becoming fewer and fewer in the cities and larger settlements, and their missionaries are starting to make great strides even in the rural areas where our gods still hold strong. \n\nIf nothing is done, then our ancestral faith will soon be nothing more than a distant memory, an academic curiosity of the old days amidst the triumph of the cross. Can the Galilean tide be stopped? Or is it time to accept the inevitable and embrace the Christian faith as our own?"
 spreading_of_christianity.0001.desc.briton_gaelic: "The Christians are spreading like a plague across Europe. The old gods of the Romans have already largely given way to the singular worship of the Christian god, and it seems that our gods may not be much further behind. Already many chiefs and kings have decided to accept the missionaries and embrace this new religion, allowing them to spread their faith deep into our heartlands.\n\nIf nothing is done, our ancestral faith will soon be nothing more than a distant memory, a scattering of half-remembered tales amidst the triumph of the cross. Can the old ways be preserved? Or is it time to accept the inevitable and embrace the Christian faith as our own?"
 spreading_of_christianity.0001.desc.other_non_christian: "The faith of the Christians is a peculiar one, insisting on the worship of their god to the exclusion of all others and incessantly seeking to spread their faith further and further beyond. While some say that their Christ is a weak and peace-loving god, we would do well not to underestimate the zeal of his followers and the power of his church. \n\nWhile we have seen little in the way of missionary activity so far, it may only be a matter of time before their church turns its sights to us in full force. But perhaps that may not be all that bad - it could also be an opportunity to seek better ties with the rich lands of the south and harness their knowledge and culture for ourselves."
 spreading_of_christianity.0001.a.christian: "Let them hear the good news!"
 spreading_of_christianity.0001.a.hellenic: "This may be the last gasp of the old gods..."
 spreading_of_christianity.0001.a.briton_gaelic: "We must make our choice soon."
 spreading_of_christianity.0001.a.other_non_christian: "We should keep an eye on this."
 
 spreading_of_christianity.0010.t: "[current_county.GetName|U] Converted to [GetReligionByKey('christianity_religion').GetNameNoTooltip]"
 spreading_of_christianity.0010.desc: "[GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] missionaries have converted the [county.GetName] to [current_county.GetFaith.GetName] #weak ([old_faith.GetAdjective])#!"
 
 spreading_of_christianity.0020.t.phase_0.decreased: "[GetReligionByKey('christianity_religion').GetNameNoTooltip] Marginalized in [current_sub_region.GetNameNoTooltip]"
 spreading_of_christianity.0020.t.decreased: "[GetReligionByKey('christianity_religion').GetNameNoTooltip] Declining in [current_sub_region.GetNameNoTooltip]"
 spreading_of_christianity.0020.t.phase_1.increased: "[GetReligionByKey('christianity_religion').GetNameNoTooltip] Established in [current_sub_region.GetNameNoTooltip]"
 spreading_of_christianity.0020.t: "[GetReligionByKey('christianity_religion').GetNameNoTooltip] [current_sub_region.GetCurrentPhase.GetType.GetNameNoTooltip] in [current_sub_region.GetNameNoTooltip]"
 spreading_of_christianity.0020.desc.phase_0.decreased.christian: "The [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] presence in [current_sub_region.GetName] has dwindled to almost nothing. Significant communities remain only in a few remaining redoubts, and any attempts at missionary activity have ceased almost entirely as the church now retains little presence outside these areas. The end of a [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] [current_sub_region.GetNameNoTooltip] may well be near - the pagans have triumphed, and it may not be long before the faith is lost there entirely."
 spreading_of_christianity.0020.desc.phase_0.decreased.non_christian: "The [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] presence in [current_sub_region.GetName] has dwindled to almost nothing. Significant communities remain only in a few remaining redoubts, and any attempts at missionary activity have ceased almost entirely as the [GetReligionByKey('christianity_religion').GetAdherentNamePluralNoTooltip] now retain little presence outside these areas. The end of [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] [current_sub_region.GetNameNoTooltip] seems imminent - the old ways have triumphed, and may it stay that way."
 spreading_of_christianity.0020.desc.phase_1.increased.christian: "Churches and missionaries are becoming a regular sight in [current_sub_region.GetName] as the [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] faith spreads. Formerly a marginal faith with little presence outside of travelling merchants and the occasional missionary, the church has secured a foothold of converts in the region and established a number of growing communities. While the vast majority of [current_sub_region.GetName] continues to follow the old ways, a foundation has now been established from which the faith will be able to grow."
 spreading_of_christianity.0020.desc.phase_1.increased.non_christian: "Churches and missionaries are becoming a regular sight in [current_sub_region.GetName] as the [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] faith spreads. Formerly a marginal faith with little presence outside of travelling merchants and the occasional missionary, the church has secured a foothold of converts in the region and established a number of growing communities. While the vast majority of [current_sub_region.GetName] continues to follow the old ways, the [GetReligionByKey('christianity_religion').GetAdherentNamePluralNoTooltip] have now established a beachhead, and it is certain that they will not stop there."
 spreading_of_christianity.0020.desc.phase_1.decreased.christian: "Under pressure from the spread of other religions, the [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] faith is in serious decline in [current_sub_region.GetName]. While the faith still remains strong in some areas, congregations are shrinking in many places and many smaller churches have been abandoned entirely as [GetReligionByKey('christianity_religion').GetAdherentNamePluralNoTooltip] abandon the faith in greater and greater numbers. Missionary activity has largely come to a standstill as the church increasingly turns to maintaining what flocks it already has, and some fear that if the situation does not change the very idea of a [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] [current_sub_region.GetNameNoTooltip] may soon be a thing of the past."
 spreading_of_christianity.0020.desc.phase_1.decreased.non_christian: "Under pressure from the spread of other religions, the [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] faith is in serious decline in [current_sub_region.GetName]. While they still remain strong in some areas, [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] congregations are shrinking in many places and many smaller churches have been abandoned entirely as [GetReligionByKey('christianity_religion').GetAdherentNamePluralNoTooltip] abandon the faith in greater and greater numbers. Missionary activity against has largely come to a standstill as their church increasingly turns to maintaining what flocks it already has - the old ways have returned, and the [GetReligionByKey('christianity_religion').GetAdherentNamePluralNoTooltip] may not be able to hold out against them for much longer."
 spreading_of_christianity.0020.desc.phase_2.increased.christian: "The [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] faith has made great strides in its efforts to convert the people of [current_sub_region.GetName]. New churches are springing up all across the region to minister to the increasing numbers of converts, and there is no part of [current_sub_region.GetName] where the presence of the church is not at least felt. While the faith is not yet completely dominant, it is now firmly established as one of the main religions in [current_sub_region.GetName] and it may only be a matter of time before the region is completely Christianized."
 spreading_of_christianity.0020.desc.phase_2.increased.non_christian: "The [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] faith is spreading rapidly among the people of [current_sub_region.GetName]. New churches are springing up all across the region to minister to the increasing numbers of converts, and there is no part of [current_sub_region.GetName] where the presence of [GetReligionByKey('christianity_religion').GetNameNoTooltip] is not at least felt. While it is not yet completely dominant and there are many areas where the old ways still hold strong, it is now clear that the [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] faith has firmly established itself as one of the main religions in [current_sub_region.GetName], with no signs of slowing its spread."
 spreading_of_christianity.0020.desc.phase_2.decreased.christian: "Once unquestionably dominant in [current_sub_region.GetName], the number of the faithful there has diminished significantly as the spread of other faiths continue. There are now many areas where [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] communities form only a minority, and even some where the faith is now almost entirely absent. The old [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] hegemony over [current_sub_region.GetNameNoTooltip] is under severe threat, if it is not already gone, and it is clear now that the situation must change if [current_sub_region.GetNameNoTooltip] is to remain a [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] region."
 spreading_of_christianity.0020.desc.phase_2.decreased.non_christian: "Once unquestionably dominant in [current_sub_region.GetName], the grip of the [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] faith has diminished significantly as the spread of old ways continue. There are now many areas where [GetReligionByKey('christianity_religion').GetAdherentNamePluralNoTooltip] are once more outnumbered by the followers of the old ways, and even some where their presence is now almost entirely absent. All across [current_sub_region.GetNameNoTooltip], the old ways continue to spread and grow, and the [GetReligionByKey('christianity_religion').GetAdherentNamePluralNoTooltip] are quickly finding that their faith and dominance is not inevitable."
 spreading_of_christianity.0020.desc.phase_3.increased.christian: "The [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] faith is now indisputably dominant over [current_sub_region.GetName], with its followers now outnumbering all the remaining adherents of the old pagan ways. There is scarcely an area where you cannot find at least one church, and indeed in many places the faith is now so widespread that you would be hard-pressed to find any significant number of remaining pagans. There is still quite some way to go before the region can be considered fully converted, but [current_sub_region.GetName] can now be comfortably counted as among the nations of the faithful."
 spreading_of_christianity.0020.desc.phase_3.increased.non_christian: "The [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] faith is now indisputably dominant over [current_sub_region.GetName], with its followers now outnumbering all the remaining adherents of the old ways. There is scarcely an area where you cannot find at least one church, and indeed in many places [GetReligionByKey('christianity_religion').GetNameNoTooltip] is now so widespread that you would be hard-pressed to find any significant community still following the old ways. Their dominance is not yet complete and indeed there are still some areas where the old ways remain strong, but even these are slowly fading in the face of continued pressure and may not be able to hold out for that much longer."
 spreading_of_christianity.0020.desc.phase_3.decreased.christian: "The [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] faith is in decline in [current_sub_region.GetName]. While still the main and dominant faith in the region, it no longer holds as much of an overwhelming dominance as other communities have grown and indeed there are now a number of areas where [GetReligionByKey('christianity_religion').GetAdherentNamePluralNoTooltip] only form a minority. While the church continues to insist, not incorrectly, that [current_sub_region.GetName] remains a stronghold of the faith, even its most ardent champions admit that its position is not quite as strong as it once was."
 spreading_of_christianity.0020.desc.phase_3.decreased.non_christian: "The [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] faith is in decline in [current_sub_region.GetName]. While still the main and dominant faith in the region, it no longer holds as much of an overwhelming dominance as other communities have grown and indeed there are now a number of areas where [GetReligionByKey('christianity_religion').GetAdherentNamePluralNoTooltip] only form a minority. While the [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] church continues to insist, not completely incorrectly, that [current_sub_region.GetName] remains a stronghold of their faith, even their most ardent champions must admit that its position is not quite as strong as it once was, and that the old ways are returning once more."
 spreading_of_christianity.0020.desc.phase_4.increased.christian: "The efforts of the church to convert the people of [current_sub_region.GetName] have come to fruition. All across the region the followers of the [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] faith are dominant at every level, and only in the most isolated and remote areas will you still find communities of heavily marginalized pagans. [current_sub_region.GetName] is now well and truly a stronghold of the faith, and may it remain so until the end of days."
 spreading_of_christianity.0020.desc.phase_4.increased.non_christian: "The efforts of the [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] church to convert the people of [current_sub_region.GetName] have come to fruition. All across the region the followers of the [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] faith are dominant at every level, and only in the most isolated and remote areas will you still find communities of pagans who have not yet been converted. [current_sub_region.GetName] is now well and truly a [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] province - the old ways are rapidly fading away, and it may not be long before they are lost entirely."
 spreading_of_christianity.0020.tt_phase_increased: "[current_sub_region.GetName] has moved to the [current_sub_region.GetCurrentPhase.GetType.GetName] phase of the [situation.GetName] [situation|E]. [christian_proselytization|E] Monthly Progress in the region will be #positive_value increased#!."
 spreading_of_christianity.0020.tt_phase_decreased: "[current_sub_region.GetName] has moved to the [current_sub_region.GetCurrentPhase.GetType.GetName] phase of the [situation.GetName] [situation|E]. [christian_proselytization|E] Monthly Progress in the region will be #negative_value decreased#!."
 spreading_of_christianity.0020.a.increased.christian: "Praised be the Lord!"
 spreading_of_christianity.0020.a.increased.non_christian: "Most concerning."
 spreading_of_christianity.0020.a.decreased.christian: "We must redouble our efforts and protect the faith!"
 spreading_of_christianity.0020.a.decreased.non_christian: "Perhaps now they will learn some humility..."
 spreading_of_christianity.0020.a.decreased.non_christian.phase_0: "May [current_sub_region.GetNameNoTooltip] never have to suffer these fools again."
 
 spreading_of_christianity.0101.t: "First [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] Anglo-Saxon [target_char.Custom('GetQueenKing')]"
 spreading_of_christianity.0101.desc: "[target_char.GetName] has become the first Anglo-Saxon King to swear off the traditional gods of the Anglo-Saxon peoples and officially adopt [GetReligionByKey('christianity_religion').GetNameNoTooltip]. This comes to the delight of [target_char.GetHerHis] [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] subjects and the church at large which has sent many priests and missionaries to [target_char.GetHerHis] kingdom to help establish the faith, while those who still hold true to the old gods watch these developments with worry.\n\n[target_char.GetTitledFirstNamePossessive] conversion is a watershed moment for the Anglo-Saxons, many of who are now looking at the possibility of following [target_char.GetHerHis] lead with renewed interest. [target_char.GetTitledFirstName] has made [target_char.GetHerHis] mark as the first [GetReligionByKey('christianity_religion').GetAdjectiveNoTooltip] Anglo-Saxon [target_char.Custom('GetQueenKing')] - but [target_char.GetSheHe] is unlikely to be the last."
 spreading_of_christianity.0101.tt: "[GetCulturePillar('heritage_west_germanic').GetName] [heritage|E] [counties|E] will no longer get a penalty to [christian_proselytization|E] Monthly Progress"
 spreading_of_christianity.0101.tt.saxon_rite.1: "The [created_saxon_rite.GetRite.GetName] has been founded."
 spreading_of_christianity.0101.a.anglosaxon.christian: "Excellent! We will rule Britain in the name of God!"
 spreading_of_christianity.0101.a.anglosaxon.non_christian: "This is unacceptable! We must remain true to our ancient Gods!"
 spreading_of_christianity.0101.a.briton.christian: "At last, the true light of God has touched those brutal boors."
 spreading_of_christianity.0101.a.briton.non_christian: "They are barbarians no matter which god they worship..."
 spreading_of_christianity.0101.a.other.christian: "Praised be the Lord!"
 spreading_of_christianity.0101.a.other.non_christian: "This is troubling news..."
 spreading_of_christianity.0101.b: "We shall make this new faith our own!"
 spreading_of_christianity.0101.b.tt: "All [THIS.Char.GetFaith.GetAdjective] [counties|E] and [characters|E] of your [heritage|E] in your realm will also convert to the new #V $saxon_rite$#!"
 
 ## Gregorian Mission
 BTWK_soc_gregorian_mission_story: "The Augustinian Mission"
 BTWK_soc_gregorian_mission_story_desc: "What began as a single mission from across the sea may yet transform the fate of Britain. The faith of Christ is spreading among the Anglo-Saxons, winning converts, drawing rulers into its fold, and establishing a church where once were only scattered believers."
 spreading_of_christianity.0202.t: "A Mission from Rome?"
 spreading_of_christianity.0202.desc: "A delegation of foreign priests stands before me, led by a [gregorian_mission_augustine.GetWomanMan] called [gregorian_mission_augustine.GetName], who claims to bear the blessing of the bishop of Rome. [gregorian_mission_augustine.GetSheHe|U] asks permission to establish a mission, promising to teach us the ways of their god. \n\nA few unarmed men surely pose little threat. They are clearly learned men who could aid the development of the kingdom with their wise counsel, and the prospect of closer ties and trade with Rome and the other Christian kingdoms of the continent is most tempting. Their promises of salvation, too, have turned more than a few heads—but is this all really worth abandoning the faith of my ancestors?"
 spreading_of_christianity.0202.a: "They may preach."
 spreading_of_christianity.0202.a.tt.1: "You will invite [gregorian_mission_augustine.GetName] and [gregorian_mission_augustine.GetHerHis] missionaries to [THIS.Char.GetPrimaryTitle.GetNameNoTier] to convert your kingdom to [gregorian_mission_augustine.GetFaith.GetName]. [gregorian_mission_augustine.GetSheHe|U] will arrive in a couple of weeks."
 spreading_of_christianity.0202.a.tt.2: "[gregorian_mission_augustine.GetName] will establish a new [archdiocese|E] at #V [GetArchdioceseName(mission_archdiocese_story)]#! under your rule, serving as the first [archbishop|E], and found a new [gregorian_mission_augustine.GetFaith.GetAdjective] [rite|E], the #V $saxon_rite$#!. He will then begin converting your kingdom to the new faith."
 spreading_of_christianity.0202.a.tt.2.not_king: "[gregorian_mission_augustine.GetName] will establish a new [archdiocese|E] at #V [GetArchdioceseName(mission_archdiocese_story)]#!, serving as the first [archbishop|E], and found a new [gregorian_mission_augustine.GetFaith.GetAdjective] [rite|E], the #V $saxon_rite$#!. He will then begin converting your kingdom to the new faith."
 spreading_of_christianity.0202.a.tt.3: "When the missionaries arrive, you will gain [GetModifier('BTWK_soc_accepted_gregorian_mission_modifier').GetNameWithTooltip] for #V 30 years#!."
 spreading_of_christianity.0202.a.tt.4: "Once the mission has been firmly established, other Anglo-Saxon kings may also follow your lead and convert to the #V $saxon_rite$#! of [gregorian_mission_augustine.GetFaith.GetName].
 spreading_of_christianity.0202.b: "These lands have no use for you and your stories. Begone!"
 spreading_of_christianity.0202.b.tt: "[gregorian_mission_augustine.GetName] will attempt to find another king more willing to accept his mission."
 spreading_of_christianity.0204.t: "The Augustinian Mission"
 spreading_of_christianity.0204.desc: "News has spread of the missionaries who crossed the sea to preach of Christianity to the heathens in [mission_host_king.GetPrimaryTitle.GetNameNoTier]. Under [gregorian_mission_augustine.GetName], the mission has begun its slow work of changing local hearts, guiding new believers, and building houses of worship, with the stated goal of converting all the Anglo-Saxon kingdoms to the faith. \n\nThe missionaries have adapted their teachings to the local customs, resulting in the creation of a new '[GetRiteByKey('saxon_rite').GetName]', and have established a new $game_concept_archdiocese$ at [gregorian_mission_augustine.GetPrimaryTitle.GetNameNoTier] as they seek to restore the power of the church to Britannia. From this place, the missionaries preach to the people and seek the support of their rulers."
 spreading_of_christianity.0204.a.mission_host_king: "Let us see if their efforts bear fruit."
 spreading_of_christianity.0204.a.anglosaxon.christian: "Joyous day! I pray other kings may see the light."
 spreading_of_christianity.0204.a.anglosaxon.non_christian: "I fear this folly will bring only ruin..."
 spreading_of_christianity.0204.a.briton.christian: "Perhaps the faith may yet still the swords of these brutes?"
 spreading_of_christianity.0204.a.briton.non_christian: "Let the Saxons worship whoever they like. I know what I believe."
 spreading_of_christianity.0204.a.other.christian: "May this mission spread the Gospel ever further."
 spreading_of_christianity.0204.a.other.non_christian: "A foreign king invites foreign gods into his home? What nonsense."
 spreading_of_christianity.0204.tt.1: "$BTWK_clerical_titles.0001.tt$"
 spreading_of_christianity.0204.tt.2: "The [gregorian_mission_augustine.GetRite.GetName] has been founded."
 spreading_of_christianity.0204.tt.3: "[gregorian_mission_augustine.GetName] has begun to convert the [mission_host_king.GetPrimaryTitle.GetName] to the [gregorian_mission_augustine.GetRite.GetName] of [gregorian_mission_augustine.GetFaith.GetName], and will soon attempt to expand [gregorian_mission_augustine.GetHerHis] mission to the other Anglo-Saxon kingdoms."
 spreading_of_christianity.0204.tt.mission_host_king: "[gregorian_mission_augustine.GetTitledFirstName] will begin to convert your kingdom to [gregorian_mission_augustine.GetRite.GetName]"
 spreading_of_christianity.0205.t: "A Failed Mission"
 spreading_of_christianity.0205.desc: "Despite their long journey from Rome, [gregorian_mission_augustine.GetName] and [gregorian_mission_augustine.GetHerHis] companions have found no king willing to receive them, their appeals rejected at every court, leaving them without a place to build their mission or a people to whom they could preach. At least for now, the effort to bring Christianity to the Anglo-Saxons has failed before it began."
 spreading_of_christianity.0205.a.anglosaxon.christian: "Why do our people still refuse to see the light?"
 spreading_of_christianity.0205.a.anglosaxon.non_christian: "Good riddance."
 spreading_of_christianity.0205.a.briton.christian: "Trying to convert these barbarians is useless. They will never know peace."
 spreading_of_christianity.0205.a.briton.non_christian: "I care little of the Saxons or how they worship."
 spreading_of_christianity.0205.a.other.christian: "Another opportunity to turn these lands to our church, lost yet again."
 spreading_of_christianity.0205.a.other.non_christian: "These distant religious matters have little to do with me."
 spreading_of_christianity.0205.a.tt.1: "All potential hosts have rejected [gregorian_mission_augustine.GetName] and [gregorian_mission_augustine.GetHerHis] missionaries, forcing [gregorian_mission_augustine.GetHerHim] to cancel [gregorian_mission_augustine.GetHerHis] plans to minister to the Anglo-Saxons."
 spreading_of_christianity.0205.a.tt.2: "If you choose, however, you will be able to resurrect these plans and invite a mission to your realm through the #V $BTWK_soc_invite_gregorian_mission$#! decision."
 spreading_of_christianity.0210.t: "Expanding the Mission"
 spreading_of_christianity.0210.desc: "For several years now, I have toiled to establish the faith in this kingdom. The work is exhausting, but gratifying, and it is just now beginning to bear fruit. \n\nYet most of the Anglo-Saxons still worship their ancestral gods, and I can never rest while so many remain beyond the Church's embrace. The time has come to gather a new company of priests, seek an audience with the nearby [next_target_king.GetName], and ask that [next_target_king.GetSheHe], too, permit us to preach the Gospel among [next_target_king.GetHerHis] people."
 spreading_of_christianity.0210.a: "Go with God."
 spreading_of_christianity.0210.a.tt: "You will attempt to convince [next_target_king.GetName] to accept your missionaries and convert to the faith."
 spreading_of_christianity.0211.t: "A Missive from [gregorian_mission_augustine.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 spreading_of_christianity.0211.desc: "A messenger has arrived bearing a letter from [gregorian_mission_augustine.GetName], who writes from the newly founded see of [gregorian_mission_augustine.GetPrimaryTitle.GetNameNoTierNoTooltip] where [gregorian_mission_augustine.GetSheHe] and [gregorian_mission_augustine.GetHerHis] companions have been preaching for the last several years. [gregorian_mission_augustine.GetSheHe|U] wishes to send missionaries to my court, that they might explain their god and teach their beliefs to my people. [gregorian_mission_augustine.GetSheHe|U] promises that Christianity will bring closer ties to and trade with the Christian kingdoms of the continent, and offers [gregorian_mission_augustine.GetHerHis] most learned priests to aid in my kingdom's development with their wise counsel. \n\nBut what would such action mean for my authority, my ancient faith, or the loyalty of my people? Should I welcome these strangers, as it appears that other kings already have?"
 spreading_of_christianity.0211.a: "How intriguing. Let them come."
 spreading_of_christianity.0211.a.tt: "[gregorian_mission_augustine.GetTitledFirstNamePossessive] missionaries will gradually convert your kingdom to the [gregorian_mission_augustine.GetRite.GetName] of [gregorian_mission_augustine.GetFaith.GetName]."
 spreading_of_christianity.0211.b: "Preposterous! Of course not."
 spreading_of_christianity.0211.b.tt: "You refuse to allow the missionaries into your realm."
 spreading_of_christianity.0212.t: "The Mission Expands"
 spreading_of_christianity.0212.desc: "At last, a reply has arrived from [next_target_king.GetName], with the most glorious news. [next_target_king.GetSheHe|U] has granted us permission to send missionaries into [next_target_king.GetHerHis] lands. I give thanks to God that another door has opened before us, and pray that my brethren will make good use of this opportunity. We have so much work yet to do, but the faith has found another fertile plot of soil in which to take root."
 spreading_of_christianity.0212.a: "By the grace of God, we persevere."
 spreading_of_christianity.0212.a.tt: "[next_target_king.GetName] has accepted your missionaries, and [next_target_king.GetPrimaryTitle.GetNameNoTier] will surely soon be converted."
 spreading_of_christianity.0213.t: "Missionaries Rejected"
 spreading_of_christianity.0213.desc: "I have received my reply, and it is not the one for which I had hoped. [next_target_king.GetTitledFirstName] has refused my request, denying our missionaries leave to enter [next_target_king.GetHerHis] lands and preach the Gospel. This is a setback, but a temporary one. I know that not every heart will open to the faith at the first knocking. We must be patient, continue our work, and pray that another ruler will prove more willing to hear our appeal."
 spreading_of_christianity.0213.a: "The mission goes on."
 spreading_of_christianity.0213.a.tt: "[next_target_king.GetName] has rejected your missionaries. It seems that the conversion of [next_target_king.GetPrimaryTitle.GetNameNoTier] will have to wait a little longer."
 spreading_of_christianity.0214.t: "The Baptism of [root_capital_barony.GetNameNoTierNoTooltip]"
 spreading_of_christianity.0214.desc.augustine_baptized: "It has been many months since I first welcomed [gregorian_mission_augustine.GetName] and [gregorian_mission_augustine.GetHerHis] companions into my kingdom. [gregorian_mission_augustine.GetSheHe|U] has spoken to me of Christ, of sin and forgiveness, and of the promise of life beyond death, even as [gregorian_mission_augustine.GetHerHis] priests have worked tirelessly to convert my subjects, until it seems my entire capital is singing their hymns. \n\n[gregorian_mission_augustine.GetTitledFirstNamePossessive] words have given me much to ponder, and now [gregorian_mission_augustine.GetSheHe] asks whether I will receive baptism and enter the fellowship of the faithful. Am I ready to forsake the old gods and place my soul in the hands of this new one?"
 spreading_of_christianity.0214.desc: "It has been many months since I welcomed the Christian missionaries into my kingdom, and their teachings have become a familiar presence at my court. When I invited the missionaries into my lands, I hoped to learn what their faith might offer my people and my rule. Now, the new Bishop [converting_bishop.GetFirstName], ordained through the church they have established here, offers to baptize me into their faith as they have done so many of my subjects already, and draw closer to Rome and the other kingdoms of Europe. I have had time to consider their words, but the decision to abandon the gods of my ancestors remains a heavy one."
 spreading_of_christianity.0214.a: "Today, I am reborn into the faith."
 spreading_of_christianity.0214.a.tt: "Many of your courtiers and family members will also convert to [gregorian_mission_augustine.GetRite.GetName]."
 spreading_of_christianity.0214.b: "You may spread your faith, but I will not be converting myself."
 spreading_of_christianity.0214.b.tt: "Some of your courtiers and family members will convert to [gregorian_mission_augustine.GetRite.GetName]."
 spreading_of_christianity.0215.t: "The Baptism of [root_capital_barony.GetNameNoTierNoTooltip]"
 spreading_of_christianity.0215.desc.king_not_converted: "[target_king.GetName] has refused the offer of salvation. I fear that [target_king.GetHerHis] refusal may discourage those who looked to [target_king.GetHerHis] baptism to offer hope of converting all of [target_king.GetPrimaryTitle.GetNameNoTier]. The Church has made progress in these lands, yet the old beliefs remain strongly rooted here. We must continue our patient work and seek other opportunities to bring the Gospel to those who have not yet heard it."
 spreading_of_christianity.0215.desc.king_converted: "I must give thanks to God! [target_king.GetName] has agreed to accept the Gospel into [target_king.GetHerHis] heart. \n\nWith this singular act, [target_king.GetNamePossessive] baptism may do more than a hundred years of preaching could ever hope to achieve, for [target_king.GetHerHis] people will look to their [target_king.Custom('GetQueenKing')] as they think of their immortal souls and consider whether to follow [target_king.GetHerHim] in this path. I pray that [target_king.GetSheHe] will prove steadfast in [target_king.GetHerHis] faith and use [target_king.GetHerHis] authority to help the Church flourish throughout [target_king.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 spreading_of_christianity.0215.a.king_not_converted: "This is disappointing, but it is not the end."
 spreading_of_christianity.0215.a.king_converted: "Praise be."
 spreading_of_christianity.0215.tt.king_converted: "[target_king.GetName] and much of [target_king.GetHerHis] court has converted to #V [gregorian_mission_augustine.GetRite.GetName]#!"
 spreading_of_christianity.0215.tt.king_not_converted: "Some of [target_king.GetNamePossessive] court has converted to #V [gregorian_mission_augustine.GetRite.GetName]#!, though [target_king.GetTitledFirstName] has refused to personally convert."
 spreading_of_christianity.0216.t: "A Missive from [gregorian_mission_augustine.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 spreading_of_christianity.0216.desc: "[title.GetNameNoTier] is mine now, and with it come all the burdens my predecessor left behind. As I take stock of them, I am forced to consider the wooden church, full of foreign priests sent by [gregorian_mission_augustine.GetName], who were welcomed into this kingdom to preach their doctrine of [gregorian_mission_augustine.GetFaith.GetName]. Now that this throne is mine, shall I allow them to continue their work, or put an end to it?"
 spreading_of_christianity.0216.a: "Of course they are still welcome here."
 spreading_of_christianity.0216.a.tt: "[gregorian_mission_augustine.GetTitledFirstNamePossessive] missionaries will continue to convert your kingdom to the [gregorian_mission_augustine.GetRite.GetName] of [gregorian_mission_augustine.GetFaith.GetName]."
 spreading_of_christianity.0216.b: "Their mission has gone on long enough."
 spreading_of_christianity.0216.b.tt: "You refuse to allow the mission to continue and expel the missionaries from your realm. However, those that have already converted are unlikely to renounce their faith."
 spreading_of_christianity.0217.t: "The Mission Continues"
 spreading_of_christianity.0217.desc: "I have received wonderful news! [new_king.GetName] has acquiesced, allowing our missionaries to remain in [new_king.GetHerHis] lands. I give thanks to God, for each royal assent brings us closer to reaching everyone who has yet to hear the Gospel. But the harvest remains vast, and we must labor faithfully while the crop is still ripe."
 spreading_of_christianity.0217.a: "Our work has barely begun."
 spreading_of_christianity.0217.a.tt: "[new_king.GetName] has allowed your missionaries to continue their work, and [next_target_king.GetPrimaryTitle.GetNameNoTier] will surely soon be converted."
 spreading_of_christianity.0218.t: "Missionaries Expelled"
 spreading_of_christianity.0218.desc: "The [new_king.Custom('GetQueenKing')] of [new_king.GetPrimaryTitle.GetNameNoTier] has refused us, and our missionaries are no longer welcome in [new_king.GetHerHis] lands. Though this unfortunate change grieves me, I must remember that the hearts of men cannot be turned to Christ by force or in haste. We shall continue our labors where we are welcomed and pray that another opportunity may soon arise."
 spreading_of_christianity.0218.a: "We must redouble our efforts."
 spreading_of_christianity.0218.a.tt: "[new_king.GetName] has rejected your missionaries. It seems the conversion of [next_target_king.GetPrimaryTitle.GetNameNoTier] will have to wait."
 spreading_of_christianity.0219.t: "Missionaries in [root_capital_barony.GetNameNoTierNoTooltip]"
 spreading_of_christianity.0219.desc: "Since my [ROOT.Char.GetTopLiege.Custom('GetQueenKing')] [ROOT.Char.GetTopLiege.GetFirstName] welcomed the Christian missionaries into our lands, I have had occasion to hear their teachings and observe their strange customs. Now they approach me in turn, offering baptism and promising eternal salvation through their god. I must decide whether to indulge their preaching or remain true to the traditions of my ancestors."
 spreading_of_christianity.0219.a: "I will accept this baptism."
 spreading_of_christianity.0219.a.tt: "Many of your courtiers and family members will also convert to [gregorian_mission_augustine.GetRite.GetName]."
 spreading_of_christianity.0219.b: "Absolutely not!"
 spreading_of_christianity.0220.t.archbishop: "Question of the Saxon Liturgies"
 spreading_of_christianity.0220.t: "Conforming to [gregorian_mission_augustine.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 spreading_of_christianity.0220.desc.archbishop: "The Church is one in its faith, even where its rites and customs differ. There is no virtue in insisting that the Saxons worship in the same way as the Britons or Romans do, if doing so makes them less willing to receive the Gospel. The missionaries have come to me with a compelling argument: the Saxons will more likely embrace a Church that reflects their own customs than those of foreign peoples."
 spreading_of_christianity.0220.desc: "I have welcomed the Christian faith into my kingdom, yet now its missionaries ask that we forsake the rites by which our own clergy have long served God. They look to [gregorian_mission_augustine.GetTitledFirstName] and the see of [gregorian_mission_augustine.GetPrimaryTitle.GetNameNoTier] as the authority for how we should worship, claiming that our differences must be corrected if we are to stand together in the faith."
 spreading_of_christianity.0220.a.archbishop: "I accept their wisdom. From now on, we preach the [GetRiteByKey('saxon_rite').GetName]."
 spreading_of_christianity.0220.a: "Very well. We shall adopt the [GetRiteByKey('saxon_rite').GetName]."
 spreading_of_christianity.0220.a.tt: "Most of your vassals, courtiers, and family members of your [faith|E] and [heritage|E] will also convert to [GetRiteByKey('saxon_rite').GetName]."
 spreading_of_christianity.0220.b.archbishop: "I will not be swayed from our teachings."
 spreading_of_christianity.0220.b: "No, the [ROOT.Char.GetRite] is the one true path."
 spreading_of_christianity.0290.t: "The Augustinian Mission Ends"
 spreading_of_christianity.0290.desc: "The long work of the missionaries in $e_aengland$ is finished, having built a new Church with its own local bishops, priests, and congregations. Across the Anglo-Saxon kingdoms, Christian religious communities run themselves without the need for foreign stewardship. While not every kingdom has been fully converted and the old pagan faith still persists in many areas, the church has now truly grown to the point of being adopted by all, kings and commoners alike."
 spreading_of_christianity.0290.a.gregorian_mission_augustine: "I could imagine no better end."
 spreading_of_christianity.0290.a.anglosaxon.christian: "I am proud to have played a part in this, however small."
 spreading_of_christianity.0290.a.anglosaxon.non_christian: "They will not be missed."
 spreading_of_christianity.0290.a.briton.christian: "I wasn't certain they would succeed in this."
 spreading_of_christianity.0290.a.briton.non_christian: "I never thought they would get this far, but at least they're finally gone."
 spreading_of_christianity.0290.a.other.christian: "At last, the Anglo-Saxon heathens have been brought into the light of God."
 spreading_of_christianity.0290.a.other.non_christian: "And another weak-minded people falls before the cross."
 spreading_of_christianity.0290.a.tt: "Missionary events associated with the Augustinian Mission will no longer trigger."
 spreading_of_christianity.0292.t: "Apostle to the English"
 spreading_of_christianity.0292.desc.canterbury_canonizer: "The memory of [gregorian_mission_augustine.GetName] has endured since his death, carried on by the clergy he taught and the faithful whose lives he changed. Now the Church formally recognizes the holiness of the man whose labors helped Christianity flourish among the Anglo-Saxons. His pallium now rests with me as a sacred reminder of the mission he began and the faith we are charged to preserve."
 spreading_of_christianity.0292.desc: "[gregorian_mission_augustine.GetName], who traveled from Rome to preach Christianity among the Anglo-Saxons, has been declared a saint. His mission, once a precarious undertaking in unfamiliar lands, helped establish a Church that has endured beyond his lifetime. Whether welcomed as a holy man or regarded simply as a figure of history, his influence upon the kingdoms of $e_aengland$ cannot be denied."
 spreading_of_christianity.0292.a.canterbury_canonizer: "I will never forget my duty to the Church [gregorian_mission_augustine.GetSheHe] built."
 spreading_of_christianity.0292.a.anglosaxon.christian: "Truly, [gregorian_mission_augustine.GetTitledFirstName] deserved no less."
 spreading_of_christianity.0292.a.briton.christian: "What a great [gregorian_mission_augustine.GetWomanMan]."
 spreading_of_christianity.0292.a.other.christian: "I suppose that was a worthy deed."
 spreading_of_christianity.0292.a.tt: "[gregorian_mission_augustine.GetName] has been declared a [Concept('canonized', 'Saint')|E] of the [THIS.Char.GetFaith.GetAdjective] faith."
 spreading_of_christianity.0292.a.tt.relic.1: "You have gained the [newly_created_artifact.GetName] as an [artifact|E] in your keeping."
 spreading_of_christianity.0292.a.tt.relic.2: "The [newly_created_artifact.GetName] has been [enshrined|E] in the [holy_site|E] of [relic_enshrined_location.GetName]."
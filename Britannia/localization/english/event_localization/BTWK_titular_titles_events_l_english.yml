l_english:

 # Anglo-Saxon events
 titular_titles_anglosaxon.0001.t: "The [new_duchy_title.GetNameNoTooltip|U]"
 titular_titles_anglosaxon.0001.desc.intro: "After seizing control of the region from its former Brythonic owners, the [conqueror.GetCulture.GetName] rulers of [new_duchy_title.Custom('title_region_location')] have created the '[new_duchy_title.GetName]' in the lands they now call their own."
 titular_titles_anglosaxon.0001.desc.d_hampshire: "Some said it was only a matter of time before the coast of the Solent would fall, threatened by constant Saxon piracy since the 3rd century. In the aftermath of conquest, a large number of Jutish settlers have begun to homestead in the lush woodlands, forming a distinct folkland along the Itchen and Meon rivers.\n\nFrom this day on, the Roman city of Clausentum and the provinces of the Solent coast"
 titular_titles_anglosaxon.0001.desc.d_winchestershire: "The decline of Venta Belgarum can easily be witnessed as infrastructure continues to crumble, and the River Itchen spills into now overgrown fields. Farmsteads and watch-halls are raised here in anticipation of what the conquerors call 'Wintansċīr' becoming a renewed royal center.\n\nFrom this day on, this city, once called Venta by the Romans and the surrounding Belgae heartland"
 titular_titles_anglosaxon.0001.desc.d_somerset: "As the Germanic conquest of Britain has unfolded, the lands of Glastenning were spared by the protective Mendip Hills and the wetlands of the River Parrett. This was not to last. Invading Germanic armies have seized the crown jewel of the Dumnonians, and much of their demoralised elite have chosen to flee aboard countless ships to settle with their kin in Armorica.\n\nFrom this day on, the Roman city of Lindinis and the lands of Glastenning"
 titular_titles_anglosaxon.0001.desc.d_cilternsaete: "The so-called 'Chiltern dwellers,' Britons who eked out a living upon the chalk slopes by grazing their flocks and hunting what the hills would yield, have found themselves subjugated. While some are dispossessed or taken into the service of new lords, many continue to live just as they did before, waxing and waning between their winter and summer pastures as the landscape demands.\n\nFrom this day on, the settlement of Castrum Ecclesiae and the surrounding provinces"
 titular_titles_anglosaxon.0001.desc.d_dorset: "A vital province of Dumnonia has been seized with an immense display of arms. The sheltering downs and the stony strand that once guarded the ships of Roman invaders many centuries ago have opened themselves once more. Deprived of their power base, it seems unlikely that, without an invasion by the Britons of Cambria, the people of Constantine Corneu will reclaim their birthright.\n\nFrom this day on, the lands that once formed the Principality of Durnovaria"
 titular_titles_anglosaxon.0001.desc.d_wiltshire: "Tales tell of a scant band of warriors at Caer Ambra defending as best they could an ancient stone circle to no avail. The barrows, cursus and trackways of these wild lands have become but the newcomers' marching-grounds and highways.\n\nFrom this day on, the great henge by the River Avon and the city of Sorviodunum"
 titular_titles_anglosaxon.0001.desc.d_devon: "What the Britons of Isca lacked in urbanisation, they made up for in their production of tin, ever precious despite the growing preference for iron weaponry. Village by village, the invaders assumed stewardship of the mines while diverting production to fuel the anticipated push westward, to the land's end.\n\nFrom this day on, what remains of the Roman fortress of Isca and the surrounding provinces"
 titular_titles_anglosaxon.0001.desc.d_cornwall: "At the very end of the land, a marker-stone was set, its face turned to sea proclaiming the victory of the Anglo-Saxons. Crossing the countless moorlands to reach this headland was a daunting task when measured against the knowhow of the Cornish warbands, who, owing to many years of war, were isolated and heavily outnumbered.\n\nFrom this day on, the Cornish peninsula, including the stronghold of Tintagel,"
 titular_titles_anglosaxon.0001.desc.d_berkshire: "The Ġewisse, once no more than a band of Saxon mercenaries hired to guard the banks of the upper Thames, have rooted themselves in the land. With the native population subjugated, these lands shall surely serve as a solid base for further expansion.\n\nFrom this day on, a substantial portion of the interior, including the towns of Aelia Castra and Dorcocensis,"
 titular_titles_anglosaxon.0001.desc.d_hwicce: "A great swath of land that rivals the output of Sussex or Kent, the old lands of the Dobunni are dotted by villas and sophisticated Roman farms. The conquest of Glevum, one of the few cities that continued to prosper after the withdrawal of Roman troops, surely comes as a shock to neighbouring princes.\n\nFrom this day on, the cities of Glevum and Corinium, as well as the valley of the River Avon"
 titular_titles_anglosaxon.0001.desc.d_south_angles: "Lactodurum, where the road to Viroconium narrows to ford the River Nene, was once marked by posting-stations and wheelwrights serving an outsized pottery and grain trade. While the rich clay deposits have become a burden through poor drainage and the neglect of ditches, the new conquerors of these lands could easily exploit the resource.\n\nFrom this day on, the towns of Lactodurum and Bannaventa and the surrounding provinces"
 titular_titles_anglosaxon.0001.desc.d_hiccas: "The small town of Durocobrivis, never a prominent sight even at its peak, had long been abandoned by the time the warbands marched through. The new Germanic inhabitants of these lands, the Hiċċe, have settled at what was once the northern extent of the Catuvellauni, adapting these poor soils into grazing lands for their horses.\n\nFrom this day on, the settlement of Durocobrivis and the surrounding provinces"
 titular_titles_anglosaxon.0001.desc.d_middleseaxe: "The jewel of Roman Britannia was once fortified with considerable merit. Despite its gradual abandonment, the name "Londinium" conjures images of splendour among the Britons. Now, the stone curtain and gate-towers barely stand, [conqueror.GetCulture.GetName] sentries pace the battlements and a hastily driven palisade bars Ludgate. Smoke curls over collapsed eaves as workmen prise the remaining bronze from the basilica.\n\nFrom this day on, the city of Londinium, once the chief entrepot of Britannia,"
 titular_titles_anglosaxon.0001.desc.d_mercia: "The lands of the Tame are not particularly attractive, but what they lack in good soil is made up for in coppiced oak and alder for boat-timbers and wattling, peat and bog-iron for smithing, and pannage-rich commons where swine fatten for winter. The Tomsæte, a tribe of exceptional warriors made up of Angle foederati moving ever westward, have seized the opportunity to settle here.\n\nFrom this day on, the settlement of Letocetum and the surrounding provinces"
 titular_titles_anglosaxon.0001.desc.d_middle_angles: "At one point, Ratae served as an imposing vexillation fort, later transforming into the center of a prosperous farming region. Just as with the Corieltauvi before them, a distinct patchwork of independent [conqueror.GetCulture.GetName] tribes have begun to call this land home. It remains to be seen whether the authority of the established tribes will be respected, or whether they will be subsumed under a united kingdom of the Middle Angles.\n\nFrom this day on, the city of Ratae Corieltauvorum and the surrounding provinces"
 titular_titles_anglosaxon.0001.desc.fallback: "From this day on, the town of [new_duchy_title.GetPreferredCapital.GetNameNoTierNoTooltip] and the surrounding provinces"
 titular_titles_anglosaxon.0001.desc.outro: "will belong 'de jure' to the newly formed [new_duchy_title.GetTierAsNameNoTooltip]. Any previous claim or birthright will no longer be recognized, and the new [conqueror.GetCulture.GetNameNoTooltip] rulers will be considered the only rightful lieges of these lands."
 titular_titles_anglosaxon.0001.a.anglosaxon: "As it should be."
 titular_titles_anglosaxon.0001.a.briton_roman: "The barbarians must be stopped!"
 titular_titles_anglosaxon.0001.a: "This is interesting news..."
 titular_titles_anglosaxon.0002.t: "The [old_duchy_title.GetNameNoTooltip|U]"
 titular_titles_anglosaxon.0002.desc.intro.briton_roman: "With their reconquest of the region from the Anglo-Saxons that once claimed the area for themselves, the '[old_duchy_title.GetName]' has been destroyed by the new [conqueror.GetCulture.GetName] rulers of the lands they once called their own.\n\n"
 titular_titles_anglosaxon.0002.desc.intro: "Having wrested control of the region from the Anglo-Saxons who once seized it for themselves, the '[old_duchy_title.GetName]' has been destroyed by its new [conqueror.GetCulture.GetName] conquerors.\n\n"
 titular_titles_anglosaxon.0002.desc.d_surrey: "The Saxon lords of $d_surrey$ once ruled the approaches to the upper Thames, drawing their power from control of the river crossings and scattered communities of the southern hinterland. Now, their hold over these lands has been broken, the old roads between $c_londinium$ and the southern coast reclaimed; yet the settlers and their local chieftains, long established here, will doubtless not abandon their claims without a fight.\n\nFrom this day on, the lands of $d_surrey$"
 titular_titles_anglosaxon.0002.desc.d_cantware: "The $d_cantware$ tapped into the fertile estates and ancient strongholds of the Cantiaci, and their wealth and maritime connections made them one of the strongest of the Saxon realms. Now, the rulers of eastern $k_cantia$ are defeated, but its towns and countryside have been transformed by decades of foreign control. The new [conqueror.GetCulture.GetName] rulers must decide whether to restore the old order or forge something new from the fragments of Roman authority.\n\nFrom this day on, the old capital of $cn_canterbury_anglosaxon$ and the lands of the $d_cantware$"
 titular_titles_anglosaxon.0002.desc.d_westcantware: "The $d_westcantware$ held the western approaches to $k_cantia$, settling around the remnants of Roman roads, forts, and towns whose walls had long outlived the imperial power that built them. With their defeat, the way lies open to reclaim these ancient strongholds and sever the connection between the eastern Kentish heartland and its western dependencies; but the settlers who made their homes among the ruins will not easily relinquish the lands their forebears won.\n\nFrom this day on, the lands of the $d_westcantware$"
 titular_titles_anglosaxon.0002.desc.d_the_weald: "The $k_sussex_adj$s established their dominion over $d_the_weald$ only gradually, starting with the coastal strongholds. Then came the slow subjugation of the Britons dwelling among its forests and ridges, though the dense woodland that sheltered those communities also limited the reach of their Saxon overlords. Settlements like $cn_steyning_anglosaxon$ also grew over the intervening years. But now, those petty kings have been overthrown by the [conqueror.GetCulture.GetCollectiveNounNoTooltip].\n\nFrom this day on, the old capital of $cn_chichester_anglosaxon$ and the other provinces of $d_the_weald$"
 titular_titles_anglosaxon.0002.desc.d_eastseaxe: "The $d_eastseaxe_adj$s occupied the former lands of the Trinovantes, and generations of Saxon farmers and warriors have made their homes among the old Roman roads, villas, and fortifications. Now, the power of the Saxon kings, who once dominated the Thames estuary and the southern coast of the North Sea, has been shattered.\n\nFrom this day on, the $d_eastseaxe_adj$ lands"
 titular_titles_anglosaxon.0002.desc.d_middleseaxe: "Though the old Roman settlement at $c_londinium$ has never recovered its former glory, Saxon settlers had begun to occupy the outskirts of the town and the banks of the Thames, slowly establishing a foothold amid the remnants of Roman $e_britannia$. Now, [conqueror.GetCulture.GetName] forces have defeated the petty kings, taking over the ancient crossing of the Thames. The basilica is an empty shell, the old streets broken and overgrown, and the city's former splendor survives chiefly in memory. Yet its harbor and ancient roads still command the heart of the island, and the victors hope to make the ruined city a center of their renewed power.\n\nFrom this day on, $cn_london_anglosaxon$ and the lands of $d_middleseaxe$"
 titular_titles_anglosaxon.0002.desc.d_norfolc: "In the former northern lands of the Iceni, Angle settlers gradually occupied the countryside as the old Roman roads fell into disrepair. Now, [conqueror.GetCulture.GetName] forces have broken the power of the northern petty kings. The coast and its many river deltas remain vital to the defense of the eastern shores, but the loyalties of the people who dwell here have changed under decades of foreign rule, and the victors must secure what they have claimed.\n\nFrom this day on, $cn_elmham_anglosaxon$ and the rest of $d_norfolc$"
 titular_titles_anglosaxon.0002.desc.d_southfolc: "In the former southern lands of the Iceni, Angle rulers gathered the disparate settlements under their authority, with Wuffingas the seat of their power. Their dominion has now been broken; yet the old Roman order has been gone for generations. The new rulers must contend not only with defeated nobility but with communities whose customs have long since adapted to life under their former masters.\n\nFrom this day on, the lands of $d_southfolc$"
 titular_titles_anglosaxon.0002.desc.d_grentbryce: "The Angles built their towns and farmlands around the River Granta, where the remains of Roman roads and villas stood as silent witness to an old order. For decades, Anglo-Saxon lords held sway over these communities, but their authority has now been shattered. This conquest recovers a valuable stretch of the eastern interior, though the scattered settlements of the region will require careful tending if they are to become part of a rejuvenated $e_britannia_adj$ realm.\n\nFrom this day on, the lands of the $d_grentbryce$"
 titular_titles_anglosaxon.0002.desc.d_gyrwas: "The $d_gyrwas$ tried to dominate the fens, where the winding waterways and treacherous marshes have long frustrated the ambitions of foreign rulers. Those Anglo-Saxon petty kings have now been defeated, with $cn_north_gyrwas$ and $cn_south_gyrwas$ secured and patrols pressing deep into the southern fenlands. Yet these lands are not easily governed; with their intimate knowledge of the terrain, the locals have the advantage, and the newcomers must win their aid if they aim to keep what their armies have taken.\n\nFrom this day on, the lands of the $d_gyrwas$"
 titular_titles_anglosaxon.0002.desc.d_hiccas: "In the northern Chiltern Hills, $d_hiccas$ settlers made their homes in the old Catuvellaunian lands. Now, these petty kings have been defeated, from the Chilterns to as far as $cn_dunstable_anglosaxon$, along the old routes that once connected the southern provinces to the Midlands. The new rulers may restore old boundaries on their maps, but they will find that the inhabitants of those lands have made new lives in the meantime, and that ancient claims alone cannot determine their future.\n\nFrom this day on, the lands of the $d_hiccas$"
 titular_titles_anglosaxon.0002.desc.d_middle_angles: "The $d_middle_angles$s established themselves among the scattered settlements of the old Corieltauvi, whose lands had once prospered beneath Roman rule. Their petty kings have now been defeated, restoring control over an important crossroads of the Midlands, from $cn_oundle_anglosaxon$ to the smaller farming communities beyond. But the inhabitants have endured decades of Anglo-Saxon rule, and these new [conqueror.GetCulture.GetName] rulers must convert their military victory into a lasting allegiance among peoples long accustomed to local lords.\n\nFrom this day on, the lands of the $d_middle_angles$"
 titular_titles_anglosaxon.0002.desc.d_south_angles: "The $d_south_angles$ established their power across the central lands where the old Roman roads once carried soldiers, merchants, and messengers between the great cities of $e_britannia$. Their defeat has opened $cn_northampton_anglosaxon$ and the surrounding countryside to attack, and $cn_towcester_anglosaxon$ has likewise been wrested from Anglo control. Restoring the trade that sustained these towns will require more than a military victory, but, with it, the new rulers have taken a strategically vital stretch of the interior.\n\nFrom this day on, the lands of the $d_south_angles$"
 titular_titles_anglosaxon.0002.desc.d_mercia: "Anglo-Saxon communities of farmers, smiths, and warriors settled along the Tame, sustained by coppiced woodland, peat bogs, and iron deposits. The $d_mercia$, descendants of Angle warriors who once served as foederati before pressing westward, seized these resources and established themselves as masters of the region. Now, those masters have, and the new [conqueror.GetCulture.GetName] rulers hope to use these resources to fuel further victories.\n\nFrom this day on, the lands of the $d_mercia$"
 titular_titles_anglosaxon.0002.desc.d_pecsaete: "The $d_pecsaete$ once dominated the lands around the southern Pennine foothills, where the Roman infrastructure offered great strategic advantage. Now, the petty kings are gone; $c_bakewell$, $c_lutudarum$, and the surrounding settlements have been freed from their yoke, as an important stretch of the Midlands has come under [conqueror.GetCulture.GetName] control.\n\nFrom this day on, the lands of the $d_pecsaete$"
 titular_titles_anglosaxon.0002.desc.d_wrocensaete: "Anglo-Saxons took root in the lands around $cn_wroxeter_anglosaxon$, where the old Roman roads crossed a countryside of woodlands, pasture, and scattered settlements. Their defeat has opened routes through the western Midlands that have long been under Germanic control. Yet the intervening years have given their inhabitants time to establish their own identity, and they may not willingly bow to [conqueror.GetCulture.GetName] rule.\n\nFrom this day on, the lands of the $d_wrocensaete$"
 titular_titles_anglosaxon.0002.desc.d_magonsaete: "$d_magonsaete$ was established in the western marches, where the old Roman roads and settlements once linked the interior provinces to the lands of the Britons beyond the Severn. Now, the Anglo-Saxon petty kings are defeated or dead, and $cn_hereford_anglosaxon$, $cn_wenlock_anglosaxon$, and $cn_leominster_anglosaxon$ have fallen from their grasp. This is an important frontier to control, but the borderlands have long been shaped by conflict, and the new [conqueror.GetCulture.GetName] rulers must reckon with communities whose loyalties may be divided.\n\nFrom this day on, $cn_hereford_anglosaxon$ and the rest of $d_magonsaete$"
 titular_titles_anglosaxon.0002.desc.d_hwicce: "The $d_hwicce$ was established in the old lands of the Dobunni, where the farms and Roman towns continued to prosper even after the official withdrawal of imperial authority from $e_britannia$. The Anglo-Saxon conquest upended the region, but their dominion has now been broken. This victory offers hope of restoring the region's prosperity, though the villas have crumbled, the roads have deteriorated, and long years under foreign rule have left their mark on the countryside.\n\nFrom this day on, $cn_worcester_anglosaxon$ and the provices of the $d_hwicce$"
 titular_titles_anglosaxon.0002.desc.d_hampshire: "The Solent coast was among the first lands to suffer Anglo-Saxon raids, and among the first to fall under their control. Now, many years later, that control has been broken. Though Jutish homesteads still line the fertile valleys, and they will doubtless not surrender their fields without a fight, the old Roman roads and harbors have once more become routes for arms and armies that stand against them.\n\nFrom this day on, $cn_southampton_anglosaxon$ and the lands of the Solent coast"
 titular_titles_anglosaxon.0002.desc.d_berkshire: "Though the Ġewisse began as Saxon mercenaries charged with guarding the banks of the Thames, over the years they made themselves masters of the surrounding lands, occupying estates and strongholds built by the Romano-British lords of old. Many have known no other homeland. Now, their hold over the region has been broken, opening the river crossings and interior roads to the new [conqueror.GetCulture.GetName] authority.\n\nFrom this day on, $cn_dorchester_on_thames_anglosaxon$ and the lands of greater $d_berkshire$"
 titular_titles_anglosaxon.0002.desc.d_cilternsaete: "The flocks of the so-called 'Chiltern dwellers' still graze among the chalk hills and wooded valleys. Some were dispossessed by Saxon settlers; others entered the service of new lords, learning to live under foreign rule. Now, with the invaders driven off, these ancient peoples must decide what place they will have under the new authorities. This change promises neither their total restoration nor the vanishing of the settlers, but it does mark a new chapter for the people of the Chilterns.\n\nFrom this day on, $cn_aylesbury_anglosaxon$, $cn_bensington_anglosaxon$, and all the lands of the $d_cilternsaete$"
 titular_titles_anglosaxon.0002.desc.d_wiltshire: "In the years since the fall of $cn_caer_ambra$, the ancient barrows, stone circles, and Roman roads of those wild lands have served the Anglo-Saxon newcomers as marching grounds and highways. Now, victorious warriors have followed those same routes in the opposite direction, taking the ancient monuments and the lands around them from the invaders. The stones have outlasted both the old Roman order and the kingdoms that rose from its ashes.\n\nFrom this day on, $cn_wilton_anglosaxon$ and the lands of greater $d_wiltshire$"
 titular_titles_anglosaxon.0002.desc.d_dorset: "$d_dorset$, once the eastern reaches of old $k_dumnonia$, was formed when the Anglo-Saxon conquest severed the connection between the Britons of the southwest and their kinsmen farther east. Those petty kings held the coastal approaches and the fertile valleys inland, but their power has now been broken, reopening the routes between the peninsula and the rest of Brittania. But this victory alone cannot restore the lost principality, and the victorious conquerors must contend with settlers and subjects whose loyalties have changed with the times.\n\nFrom this day on, $cn_dorchester_anglosaxon$ and the lands of $d_dorset$"
 titular_titles_anglosaxon.0002.desc.d_somerset: "The Saxons established their dominion across the rich lowlands and river valleys of southwest $e_britannia$, where the marshes and the Mendip Hills offered shelter to communities resisting their advance. Now, that advance has been halted, as $cn_ilchester_anglosaxon$, $cn_glastonbury_anglosaxon$, and $cn_cannington_anglosaxon$ have all been lost. Though this restores a vital link between the $e_britannia_adj$ lands to the west and the territories farther east, the old $k_dumnonia_adj$ order has been scattered to distant shores, and new loyalties have taken root in their absence.\n\nFrom this day on, $cn_ilchester_anglosaxon$ and the $d_somerset$ lands"
 titular_titles_anglosaxon.0002.desc.d_devon: "Under Saxon rule, the tin mining communities of $d_westdumnonia$ were compelled to supply the needs of their new masters, and the trade that once connected the peninsula to the wider Roman world collapsed. But now, the invaders have been driven from the old fortress and its surrounding lands. The mines may again serve the $e_britannia_adj$ kingdoms, though the generations raised under foreign masters may not welcome the return of distant lords without question.\n\nFrom this day on, $cn_exeter_anglosaxon$ and the lands of $d_devon$"
 titular_titles_anglosaxon.0002.desc.d_cornwall: "A marker-stone at the end of the land of $d_cornwall$ once proclaimed the victory of the Anglo-Saxons. Yet the moorlands that made this peninsula so difficult to conquer also made it difficult to hold, and at last, the invaders have been driven from their strongholds. For the Cornish Britons, this offers them hope that they may recover a land whose people have persevered through generations of struggle, and the possibility of renewing ties with their kinsmen across the island.\n\nFrom this day on, $cn_southampton_anglosaxon$ and all $d_cornwall$"
 titular_titles_anglosaxon.0002.desc.d_winchestershire: "$d_winchestershire$ sprung up around $b_ventacastle$, once a thriving center of the Roman province, subsequently a seat of local authority even after the imperial power withdrew. Its crumbling walls and overgrown fields bear silent witness to the fading of both Roman power and the Saxon kings who succeeded it; at last, those kings have been driven off. The former Belgae heartland, including $cn_winchester_anglosaxon$, is once more free from their control. Whether its new lords can restore the city to its former importance, or must build a new center of power among the ruins, remains to be seen.\n\nFrom this day on, the lands of $d_winchestershire$"
 titular_titles_anglosaxon.0002.desc.d_deira: "$d_deira$ arose in the lands between the Humber and the northern hills. Now, the power of the petty kings has been shattered; $cn_filey_anglosaxon$, $cn_goodmanham_anglosaxon$, and the surrounding countryside has been wrested from their control. The old Roman roads still link the northern settlements, but the long period of Anglo-Saxon occupation has estranged the people from their ancient rulers, and the victors must forge a new order in lands grown accustomed to self-rule.\n\nFrom this day on, the lands of $d_deira$"
 titular_titles_anglosaxon.0002.desc.d_eoforwic: "$d_eoforwic$ grew around the remains of the Roman fortress of $cn_eburacum$, whose walls and roads endured long after the legions abandoned the north, which the Anglo-Saxon kings made the seat of their power. Now, the fortress and its surrounding lands have been captured once more, giving the new conquerors a stronghold from which to establish their own authority in the north; yet the old Roman city has suffered decades of neglect, and its recovery will require more than merely raising a new banner above its walls.\n\nFrom this day on, the lands of $d_eoforwic$"
 titular_titles_anglosaxon.0002.desc.d_lindsey: "$d_lindsey$ was established in the fertile lands south of the Humber, where the old Roman roads connected farming settlements and river crossings to the wider province. Now, the petty kings have been defeated, freeing $cn_lincoln_anglosaxon$ and the entire region, opening this important gateway between the north and the southern Midlands. The countryside has endured generations of changing rulers, and though the old Roman order cannot easily be restored, these roads and settlements may yet bind these lands to a wider $e_britannia_adj$ realm.\n\nFrom this day on, the lands of $d_lindsey$"
 titular_titles_anglosaxon.0002.desc.d_elmetsaete: "In the southern reaches of former Brigantian territory, scattered settlements connected by Roman roads remain as proof of a time when imperial authority extended well into the north. The Anglo-Saxon petty kings of $k_elmet$ have now been defeated, freeing $cn_leeds_early_anglosaxon$ and the wider countryside from their control. With this, the victors take control of an important stretch of the interior, but its distance from the eastern settlements and the strength of local allegiances will complicate their ability to build a lasting new order.\n\nFrom this day on, the lands of the $d_elmetsaete$"
 titular_titles_anglosaxon.0002.desc.d_craven: "$d_craven$ was established in the northern highlands within the old Roman frontier, where the hills offered communities shelter from the reach of distant kings. Its Anglo-Saxon rulers have now been overthrown by [conqueror.GetCulture.GetName] forces advancing into the north, and $cn_addingham_anglosaxon$ has fallen under their authority. Yet this rugged area has never been easily governed from the lowlands, and the conquerors must rely upon local leaders and the old hill routes if they are to consolidate their victory.\n\nFrom this day on, the lands of $d_craven$"
 titular_titles_anglosaxon.0002.desc.d_mersey: "$d_mersey$ comprises the river valleys and coastlines of the northwest, where the remnants of Roman roads and settlements connected the interior to the Irish Sea. Now, its petty kings have been defeated and $cn_addingham_anglosaxon$ captured, freeing the surrounding lands from Anglo-Saxon rule. The waterways remain vital routes for movement and trade, but years of foreign rule have established new communities and rivalries, and the victors must secure both the river crossings and the loyalties of the local people.\n\nFrom this day on, the lands of $d_mersey$"
 titular_titles_anglosaxon.0002.desc.d_lancaster: "After the Anglo-Saxon conquest, the town of $cn_lonsdale_anglosaxon$ was built in the uplands of the far northwest, where the rugged terrain and scattered settlements have long complicated the exercise of foreign power. Now, both $cn_lonsdale_anglosaxon$ itself and the surrounding countryside have been freed from their control. Though the old Roman walls to the north once marked the limits of imperial authority, generations have passed since its garrisons withdrew, and the people of these lands have long lived outside the protection of any lasting provincial order. Holding these valleys may prove more difficult than winning them.\n\nFrom this day on, the lands of $d_lancaster$"
 titular_titles_anglosaxon.0002.desc.d_bernicia: "$d_bernicia$ was the Anglo-Saxon name for the stronghold on the Northumbrian coast, where their rulers made themselves masters of the lands by the old Roman frontier. Now, the power of the petty kings has been broken; they have lost control of $cn_bamburghshire_anglosaxon$ and with it the entire coast that has long served as a gateway for invaders from across the sea. The old frontier fortifications and roads remain as reminders of a time when Rome claimed these lands, but the victors must establish a new order where the old one has long since vanished.\n\nFrom this day on, the lands of $d_bernicia$"
 titular_titles_anglosaxon.0002.desc.d_tynedale: "Around the valleys of the Tyne, the remnants of Roman roads and frontier works have long outlasted the imperial authority that built them. The $d_tynedale$ petty kings established here have now been defeated, as [conqueror.GetCulture.GetName] forces have captured $cn_jarrow_anglosaxon$ and secured the approaches to the river crossings. These valleys once linked the northern frontier to the provinces farther south, but years of Anglo-Saxon rule have weakened those connections, and they will take years of effort to rebuild.\n\nFrom this day on, the lands of $d_tynedale$"
 titular_titles_anglosaxon.0002.desc.d_angletweeddale: "The fertile riverlands and valuable routes through the eastern hills of $d_angletweeddale$ made the region a prize for successive rulers. Now, the petty kings have been defeated, freeing $cn_upper_teviotdale_anglosaxon$ and the Tweed river valley from their control. The old frontier between Roman $e_britannia$ and the lands beyond it has long since ceased to be a meaningful boundary, and the victors must contend with communities whose loyalties may have shifted over many years of warfare and settlement.\n\nFrom this day on, the lands of $d_angletweeddale$"
 titular_titles_anglosaxon.0002.desc.d_cumbria: "The Britons of $k_rheged$ have tried to maintain their traditions in the rugged lands west of the Pennines, where Roman roads and fortifications recall the former reach of imperial power. Though Anglo-Saxon rulers claimed these territories, their hold has now been broken, from $cn_carlisle_anglosaxon$ to $cn_wigton_anglosaxon$. The capture of these old strongholds offers the [conqueror.GetCulture.GetCollectiveNounNoTooltip] a foothold in the northwest.\n\nFrom this day on, the lands of $d_cumbria$"
 titular_titles_anglosaxon.0002.desc.d_anglelothian: "Old Roman roads and coastal routes along the eastern approaches to the Forth and the Caledonian highlands beyond once connected the northern frontier to the lands farther south. Now, the petty kings have lost $cn_dunbar_anglosaxon$, $cn_edinburgh_anglosaxon$, and the surrounding lands, and thus control of an important length of the eastern coast. But the old Roman province never extended its authority far into these northern lands, and the conquerors must build new bonds with communities long accustomed to their own chiefs.\n\nFrom this day on, the lands of $d_anglelothian$"
 titular_titles_anglosaxon.0002.desc.d_dumfriesshire: "$d_dumfriesshire$ was established among the hills and valleys of the north, where the old Roman frontier gave way to the lands of the northern Britons. The Anglo-Saxon petty kings have now been overthrown, from $cn_lower_nithsdale_anglosaxon$ to $cn_lower_annandale_anglosaxon$. These lands have long served as a meeting ground between the peoples of the north and the $e_britannia_adj$ kingdoms farther south.\n\nFrom this day on, the lands of $d_dumfriesshire$"
 titular_titles_anglosaxon.0002.desc.d_anglegalloway: "Along the rocky shores and inland valleys of $d_anglegalloway$, the sea and the hills have long sheltered communities from the reach of distant rulers. Anglo-Saxon petty kings once attempted to control this land, with $cn_farines_anglosaxon$ the seat of their power, but now they have been driven off. Yet the scattered settlements and rugged terrain that helped the local rulers resist those invaders will also challenge the new conquerors, whose authority must reach beyond their early stronghold if it is to last.\n\nFrom this day on, the lands of $d_anglegalloway$"
 titular_titles_anglosaxon.0002.desc.d_lanarkshire: "$d_lanarkshire$ was established in the river valleys of the western lowlands, beyond the effective reach of the old Roman imperial rule. The Anglo-Saxon petty kings have now been defeated, and the capture of $cn_lanark_anglosaxon$ and $cn_gobannium_britannic$ has reopened an important corridor between the southern highlands and the Forth.\n\nFrom this day on, the lands of $d_lanarkshire$"
 titular_titles_anglosaxon.0002.desc.d_ayrshire: "The river mouths and sheltered shores of the western coast connected the inland settlements to the wider waters of the Irish Sea. Now, the power of the petty kings has been broken. With the control of the coastal strongholds at $cn_kyle_anglosaxon$ and $cn_lower_cunninghame_anglosaxon$, the conquerors have gained a foothold in the western lowlands, but the region's scattered communities have lived many generations under divided rule and will not necessarily accept new rulers without complaint.\n\nFrom this day on, the lands of $d_ayrshire$"
 titular_titles_anglosaxon.0002.desc.d_stirlingshire: "$d_stirlingshire$ commanded an important passage between the Forth and the lands to the west, where rivers and narrow routes through the lowlands have long shaped the fortunes of kings. Now, the latest Anglo-Saxon petty kings have been defeated, and by capturing $cn_stirling_anglosaxon$ and $cn_giudi$ the [conqueror.GetCulture.GetCollectiveNounNoTooltip] have siezed control of important crossings between the northern and southern lands.\n\nFrom this day on, the lands of $d_stirlingshire$"
 titular_titles_anglosaxon.0002.desc.d_anglelennox: "$cn_alt_clut_anglosaxon$'s position above the Clyde made it a prize for any ruler seeking command of the western lowlands. Now, the ancient fortress has fallen once more, and with it, Anglo-Saxon domination of a region that has witnessed the rise and fall of rulers for many generations.\n\nFrom this day on, the lands of $d_anglelennox$"
 titular_titles_anglosaxon.0002.desc.d_anglemann: "$d_anglemann$ has largely been free from the struggles of the mainland, its shores open to seaborne raiders and its fortunes bound to the control of the surrounding waters. The island was held by Anglo-Saxons for a time, but with the loss of their garrison at $cn_faba_anglosaxon$, their continued presence on the island has become untenable. With this victory, the [conqueror.GetCulture.GetCollectiveNounNoTooltip] have secured a foothold in the Irish Sea, yet the island's distance from the mainland makes it difficult to govern, and the victors must secure the sea routes to ensure the survival of their new dominion.\n\nFrom this day on, the island of $d_anglemann$"
 titular_titles_anglosaxon.0002.desc.d_monmouthshire: "The [conqueror.GetCulture.GetCollectiveNounNoTooltip] have pressed into the lower reaches of the Wye and Severn, where the Saxon rulers of $d_monmouthshire$ have long guarded the routes into the western lands. Their defeat opens the way for the recovery of $cn_monmouth_anglosaxon$ and $cn_wentceaster$, whose old roads and fortifications still serve as a reminder of Roman rule, even as generations of war have changed the country around them.\n\nFrom this day on, the lands of $d_monmouthshire$"
 titular_titles_anglosaxon.0002.desc.d_glamorganshire: "The Anglo-Saxon rulers of $d_glamorganshire$ relied on the fertile lowlands and the bounty of the coast to sustain their dominion, but neither has saved them from the new invasion. With $cn_cardiff_anglosaxon$ retaken, the victors lay claim to a strategic stretch of the southern $k_wales_adj$ coastline, but the rejuvenation of its settlements and the restoration of local authority will require more than a single victory.\n\nFrom this day on, the lands of $d_glamorganshire$"
 titular_titles_anglosaxon.0002.desc.d_brecknockshire: "In the uplands around $cn_brecon_anglosaxon$, Anglo-Saxon power has always depended on controlling the valleys and the roads between disparate settlements. That power has now been broken, the petty kings driven out, but the rugged country offers little hope of an easy peace. The old ties of the Britons may yet have survived long years of foreign rule, but they are slow to trust and slower to grant their allegiance.\n\nFrom this day on, the lands of $d_brecknockshire$"
 titular_titles_anglosaxon.0002.desc.d_carmarthenshire: "The Anglo-Saxon rulers of $cn_carmarthen_anglosaxon$ and $cn_dinefwr_anglosaxon$ have been driven from their strongholds, opening the way for the recovery of the western valleys and the paths through them to the sea. The victors find a land where old Briton communities endured despite the long years of conquest and upheaval.\n\nFrom this day on, the lands of $d_carmarthenshire$"
 titular_titles_anglosaxon.0002.desc.d_pembrokeshire: "At $cn_pembroke_anglosaxon$, the petty kings have been defeated, and the fertile lowlands of the southwest peninsula have passed from Anglo-Saxon hands. Unlike the rugged uplands to the east, these well-watered fields promise abundant harvests, enough to sustain the settlements and garrisons needed to hold the coast. The [conqueror.GetCulture.GetName] conquerors know controlling these farmlands will grant them a lasting foothold in the west.\n\nFrom this day on, the lands of $d_pembrokeshire$"
 titular_titles_anglosaxon.0002.desc.d_cardiganshire: "With the defeat of the Anglo-Saxon rulers of $cn_cardigan_anglosaxon$, they have lost control over a rugged stretch of coast and hill, whose isolated settlements have often outlasted the authority of distant kings. Taking $cn_bremia$ has also strengthened the victors' position along the western shore. Yet the country has been shaped by many years of conflict, and reclaiming its strongholds is only the first step to reuniting it.\n\nFrom this day on, the lands of $d_cardiganshire$"
 titular_titles_anglosaxon.0002.desc.d_radnorshire: "The Anglo-Saxon rulers of $cn_radnor_anglosaxon$ have been driven from the valleys and passes connecting the western mountains with the lands to the east. For the conquering [conqueror.GetCulture.GetName] forces, this victory secures them an important frontier, but holding it will require vigilance against rival warlords and renewed incursions.\n\nFrom this day on, the lands of $d_radnorshire$"
 titular_titles_anglosaxon.0002.desc.d_montgomeryshire: "The fall of $cn_montgomery_anglosaxon$ marks the defeat of the petty kings who sought to command the river valleys and routes through the borderland. [conqueror.GetCulture.GetName] soldiers may have taken the settlement and its surrounding country, but the frontier remains exposed, and victory alone cannot erase the loyalties formed under generations of foreign rule and settlement.\n\nFrom this day on, the lands of $d_montgomeryshire$"
 titular_titles_anglosaxon.0002.desc.d_denbighshire: "The Anglo-Saxon rulers of $d_denbighshire$ have fallen, and with them their command of the surrounding valleys and roads to the northern coast. Controlling $cn_denbigh_anglosaxon$ and $cn_decantaburh_anglosaxon$ gives the conquering forces a stronger position in the region, where the old Roman roads and fortifications still shape the movement of armies. But the local people have endured long years of shifting rule, and establishing lasting authority will require more than mere military victory.\n\nFrom this day on, the lands of $d_denbighshire$"
 titular_titles_anglosaxon.0002.desc.d_caernarfonshire: "At $cn_caernarfon_anglosaxon$, the Anglo-Saxon rulers have been defeated and their domination of this northern peninsular stronghold brought to an end. The victors now take control of a coast pockmarked by strategic bays and difficult inlets, where the mountains shield communities from the easy reach of any king. The old Roman order survives only in memory and scattered ruins, and the new rulers must establish their authority amid a landscape transformed by long years of occupation and settlement.\n\nFrom this day on, the lands of $d_caernarfonshire$"
 titular_titles_anglosaxon.0002.desc.d_merionethshire: "The Anglo-Saxon rulers of $cn_meirioneth_anglosaxon$ have lost the rugged country of the western mountains. The steep valleys and broken coastline have long frustrated attempts to impose lasting control, and the victorious armies must contend with that same terrain as they seek to secure their victory. The wounds and divided loyalties left by conquest will not quickly heal.\n\nFrom this day on, the lands of $d_merionethshire$"
 titular_titles_anglosaxon.0002.desc.fallback: "From this day on, the town of [old_duchy_title.GetPreferredCapital.GetNameNoTierNoTooltip] and the surrounding provinces"
 titular_titles_anglosaxon.0002.desc.outro.briton_roman: "will belong 'de jure' to their ancient high lordships and kingdoms. Any previous claim or birthright held by the former Germanic rulers will no longer be recognized, and the new [conqueror.GetCulture.GetNameNoTooltip] rulers will be considered the only rightful lieges of these lands."
 titular_titles_anglosaxon.0002.desc.outro: "will belong 'de jure' to their newly formed kingdom and high lordship structure. Any previous claim or birthright held by the former Germanic rulers will no longer be recognized, and the new [conqueror.GetCulture.GetNameNoTooltip] rulers will be the only rightful lieges of these lands."
 titular_titles_anglosaxon.0002.a.briton_roman: "As it should be."
 titular_titles_anglosaxon.0002.a.anglosaxon: "This is unacceptable!"
 titular_titles_anglosaxon.0002.a: "This is interesting news..."
 titular_titles_anglosaxon.0003.t: "Integration of [current_duchy.GetNameNoTierNoTooltip|U]"
 titular_titles_anglosaxon.0003.desc: "[current_duchy.GetNameNoTier] has been under the control of [new_de_jure_liege_title.GetNameNoTier] for many decades now, but had not been fully integrated into the kingdom and still remained somewhat seperate. That has now changed, as having gained the support of the local nobility and religious authorities, [conqueror.GetName] has issued several charters and proclamations effectively incorporating [current_duchy.GetNameNoTier] as an integral part of [conqueror.GetHerHis] kingdom. From this day on, the [current_duchy.GetName] will be considered a de jure part of the [new_de_jure_liege_title.GetName], and its former masters in the [former_liege_kingdom.GetName] will no longer have any legal claim to the land."
 titular_titles_anglosaxon.0003.a.new_liege: "Excellent."
 titular_titles_anglosaxon.0003.a.former_liege: "This is unacceptable!"
 titular_titles_anglosaxon.0003.a: "This is interesting news..."
 titular_titles_anglosaxon.0005.t: "The [GetTitleByKey('k_mercia').GetAdjectiveNoTooltip] Bank"
 titular_titles_anglosaxon.0005.desc.1: "Under the rule of [conqueror.GetName], the advance of the [GetTitleByKey('k_mercia').GetAdjectiveNoTooltip] conquests along their southern flank have brought many of the [GetTitleByKey('k_wessex').GetAdjectiveNoTooltip] territories in [GetTitleByKey('d_berkshire').GetNameNoTier] under their control. Fearing further enroachments on their territory, the lords of [GetTitleByKey('k_wessex').GetNameNoTier] have signed a treaty with [conqueror.GetTitledFirstName] officially establishing the Thames as their shared border, allowing for the annexation of the north bank into [GetTitleByKey('k_mercia').GetNameNoTier]."
 titular_titles_anglosaxon.0005.desc.2.wessex_exists: "\n\nWith the fall of their old capital in [GetTitleByKey('c_dorchester').GetNameNoTier], the kings of [GetTitleByKey('k_wessex').GetNameNoTierNoTooltip] have relocated south to territories more firmly under their control. The loss of the north bank appears to have put any ambitions towards [GetTitleByKey('k_mercia').GetAdjectiveNoTooltip] territories in the midlands to an end, and the kingdom as a whole is likely to reorient towards consolidating control over the area south of the Thames instead."
 titular_titles_anglosaxon.0005.desc.2.not_wessex_exists: "\n\nWith the fall of their old centers of power in [GetTitleByKey('c_dorchester').GetNameNoTier], the lords of [GetTitleByKey('k_wessex').GetNameNoTierNoTooltip] are now increasingly looking south to territories more firmly under their control. The loss of the north bank appears to have put any ambitions towards [GetTitleByKey('k_mercia').GetAdjectiveNoTooltip] territories in the midlands to an end, and the West Saxons as a whole are likely to reorient towards consolidating control over the area south of the Thames instead."
 titular_titles_anglosaxon.0005.a.conqueror: "Excellent."
 titular_titles_anglosaxon.0005.a.former_liege: "This is unacceptable!"
 titular_titles_anglosaxon.0005.a: "This is interesting news..."
 titular_titles_anglosaxon.0007.t: "The [GetTitleByKey('d_berkshire').GetTierAsNameNoTooltip] of $BERKSHIRE$"
 titular_titles_anglosaxon.0007.desc.mercia: "Continuing [GetTitleByKey('k_mercia').GetAdjectiveNoTooltip] campaigns under [conqueror.GetName] have led to the conquest of several provinces on the south bank of the Thames. This area cuts across many pre-existing borders and so rather than attempt to integrate the existing stuctures [conqueror.GetFirstName] has decided to reorganize the region into a new [GetTitleByKey('d_berkshire').GetTierAsNameNoTooltip] of $BERKSHIRE$. While these areas have yet to be properly integrated into [GetTitleByKey('k_mercia').GetNameNoTierNoTooltip], it is clear that this intended to be just the first step of separating $BERKSHIRE$ from [GetTitleByKey('d_berkshire').GetDeJureLiege.GetNameNoTierNoTooltip] and annexing it into [conqueror.GetHerHis] kingdom."
 titular_titles_anglosaxon.0007.desc.wessex: "The loss of the north bank of the Thames to [GetTitleByKey('k_mercia').GetNameNoTierNoTooltip] has forced [conqueror.GetName] to reevaluate [conqueror.GetHerHis] remaining territories along the Thames. With the rump of $DORCICSHIRE$ too small to properly support and defend itself, the [GetTitleByKey('d_berkshire').GetTierAsNameNoTooltip] has been merged with several territories further along the river to form a new [GetTitleByKey('d_berkshire').GetName] spanning the length of the south bank. [conqueror.GetTitledFirstName] certainly hopes that this will improve [GetTitleByKey('k_wessex').GetNameNoTierPossessiveNoTooltip] ability to defend its north, though it remains to be seen how effective this will be against the armies of [GetTitleByKey('k_mercia').GetNameNoTierNoTooltip]."
 titular_titles_anglosaxon.0007.a.conqueror.mercia: "Another symbol of our conquests."
 titular_titles_anglosaxon.0007.a.conqueror.wessex: "The south bank will not fall."
 titular_titles_anglosaxon.0007.a: "This is interesting news..."
 titular_titles_anglosaxon.0009.t: "The Borders of [GetTitleByKey('d_surrey').GetNameNoTierNoTooltip]"
 titular_titles_anglosaxon.0009.desc: "The eastern border of [GetTitleByKey('d_surrey').GetNameNoTierNoTooltip] have been disputed between [GetTitleByKey('d_surrey').GetDeJureLiege.GetNameNoTier] and [GetTitleByKey('d_westcantware').GetDeJureLiege.GetNameNoTier] since the annexation of [GetTitleByKey('d_surrey').GetNameNoTierNoTooltip] some time ago, with [GetTitleByKey('d_surrey').GetDeJureLiege.GetNameNoTierNoTooltip] claiming a border considerably to the east that would include several areas that are otherwise considered to be a rightful part of [GetTitleByKey('d_westcantware').GetNameNoTier]. This simmering conflict has now been definitively resolved by [conqueror.GetNamePossessive] conquest of the disputed region, establishing an eastern border that stretches all the way to the mouth of the Lea. The [GetTitleByKey('d_westcantware').GetDeJureLiege.GetAdjectiveNoTooltip] lords have only begrudingly accepted this new state of affairs, but as their attempts to contest the annexation have proven unsuccessful they are no longer considered to have a legal claim on the land."
 titular_titles_anglosaxon.0009.a.conqueror: "As is only proper."
 titular_titles_anglosaxon.0009.a.former_liege: "This is unacceptable!"
 titular_titles_anglosaxon.0009.a: "This is interesting news..."
 titular_titles_anglosaxon.0011.t: "The [GetTitleByKey('k_northumbria').GetNameNoTooltip]"
 titular_titles_anglosaxon.0011.desc: "While the Anglo-Saxons north of the Humber have always been divided between those of [GetTitleByKey('k_bernicia').GetNameNoTier] and those of [GetTitleByKey('k_deira').GetNameNoTier], the two have never regarded each other as substantially different and it has long been the ambition for every northern king to unite the two together. After an extended struggle between different claimants hoping to impose their rule, the kingdoms of [GetTitleByKey('k_bernicia').GetNameNoTier] and [GetTitleByKey('k_deira').GetNameNoTier] have been finally and firmly united for good under the rule of [founder.GetTitledFirstName], who has declared [founder.GetHerselfHimself] the first king of a united [GetTitleByKey('k_northumbria').GetNameNoTier].\n\nWith the twin kingdoms of the north united, [founder.GetTitledFirstName] now reigns as one of the most powerful kings among the Anglo-Saxons, and indeed across Britannia as a whole. The Northumbrians now look both north to dominate the remaining kingdoms of the Cumbrians and Picts, and south to bring down their might on the other Anglo-Saxons, of Mercia and beyond. A Northumbrian hegemony over Britannia beckons - if they can grasp it."
 titular_titles_anglosaxon.0011.a.founder: "The North rises!"
 titular_titles_anglosaxon.0011.a: "This is interesting news..."
 northumbria_de_jure_shift_happened_tt: "[GetTitleByKey('k_northumbria').GetName] has become [de_jure|E] liege of all former de jure [duchies|E] of the [GetTitleByKey('k_bernicia').GetName] and the [GetTitleByKey('k_deira').GetName]"
 northumbrian_culture_emerged_from_bernician_tt: "The #high Bernician#! [culture|E] is now known as [northumbrian.GetName]"
 northumbrian_culture_emerged_from_deiran_tt: "The #high Deiran#! [culture|E] is now known as [northumbrian.GetName]"
 northumbrian_culture_emerged_from_hybrid_tt: "[northumbrian.GetName] has been created as a [hybrid_culture|E] of [bernician.GetName] and [deiran.GetName]"
 titular_titles_anglosaxon.0013.t: "The [GetTitleByKey('k_lindsey').GetNameNoTooltip]"
 titular_titles_anglosaxon.0013.desc: "Formed from the old provincial capital of Lindum and the post-Roman kingdom that rose around it, the kingdom of Lindsey has long been wealthy and influential, but never considered powerful enough to rank among the highest tier of the Anglo-Saxon kingdoms. That has now changed, however, as the rising power of [founder.GetName] over the other minor kingdoms of the area has forced the other great Anglo-Saxon kings to recognize Lindsey as their equal. Between the Humber and the Wash, a new kingdom is rising to join the ranks of the Heptarchy, the established kingdoms have been reminded that they are not the only contenders for hegemony over [GetTitleByKey('e_aengland').GetNameNoTierNoTooltip]."
 titular_titles_anglosaxon.0013.a.founder: "As is only our right."
 titular_titles_anglosaxon.0013.a: "This is interesting news..."
 titular_titles_anglosaxon.0101.t: "The [title.GetNameNoTooltip|U]"
 titular_titles_anglosaxon.0101.desc.intro: "In the lands of [title.Custom('title_region_location')], the petty lords of the region have been united under the rule of [founder.GetTitledFirstNameNicknamed] to form the new '[title.GetName]'."
 titular_titles_anglosaxon.0101.desc.body.cantia: "The newly formed [title.GetTierAsNameNoTooltip|l] lays claim to a considerable region centered around the old Roman city of [GetTitleByKey('c_durovernum').GetCountyData.GetCapital.GetBaronyNameExplicitlyNoTooltip], stretching from the Jutish settlements of [GetTitleByKey('d_cantware').GetNameNoTierNoTooltip] to the Saxon-settled areas south of the Thames."
 titular_titles_anglosaxon.0101.desc.body.sussex: "The newly formed [title.GetTierAsNameNoTooltip|l] is centered around the coastal plain south of the Weald, the site of some of the earliest Saxon settlement in Britannia, and streches deep into the forest itself."
 titular_titles_anglosaxon.0101.desc.body.essex: "The newly formed [title.GetTierAsNameNoTooltip|l] lays claim to all the Saxon settlements north of the Thames around [GetTitleByKey('c_londinium').GetCountyData.GetCapital.GetBaronyNameExplicitlyNoTooltip], its borders stretching as far as the edges of the Chilterns."
 titular_titles_anglosaxon.0101.desc.body.east_anglia: "The newly formed [title.GetTierAsNameNoTooltip|l] unites the Anglian peoples of the [GetTitleByKey('d_norfolc').GetNameNoTierNoTooltip] and [GetTitleByKey('d_southfolc').GetNameNoTierNoTooltip] in the east, and extends west into the isolated settlements of the Fens."
 titular_titles_anglosaxon.0101.desc.body.mercia: "The newly formed [title.GetTierAsNameNoTooltip|l] lays claim to all of the Anglo-Saxon midlands, from the foothills of the Pennines to almost as far as the banks of the Thames, and to the west meets includes the still-contested border with the Welsh."
 titular_titles_anglosaxon.0101.desc.body.wessex_jutish: "The newly formed [title.GetTierAsNameNoTooltip|l] lays claim to Solent coast and extends from there to the north and west, as far as the banks of the upper Thames and deep into the old territory of the Dumnonii."
 titular_titles_anglosaxon.0101.desc.body.wessex: "The newly formed [title.GetTierAsNameNoTooltip|l] lays claim to banks of the upper Thames and extends from there to the south and west, as far as the and deep into the old territory of the Dumnonii."
 titular_titles_anglosaxon.0101.desc.body.deira: "The newly formed [title.GetTierAsNameNoTooltip|l] is centered around the banks of the Derwent and lays claim to territories far to the west, from the old Roman capital of [GetTitleByKey('c_eburacum').GetCountyData.GetCapital.GetBaronyNameExplicitlyNoTooltip] to the peaks of the Pennines and the western coast beyond."
 titular_titles_anglosaxon.0101.desc.body.bernicia: "The newly formed [title.GetTierAsNameNoTooltip|l] lays claim to all of the north of Britannia, extending up the coast from the Angle settlements along the Wall to the forts of [GetTitleByKey('c_bernicia').GetCountyData.GetCapital.GetBaronyNameExplicitlyNoTooltip] and [GetTitleByKey('b_dunpeldercity').GetNameNoTierNoTooltip], and far to the west to the coasts of the Irish Sea."
 titular_titles_anglosaxon.0101.desc.body.wales: "The newly formed [title.GetTierAsNameNoTooltip|l] lays claim to all of the Cambrian Highlands that once formed the last redoubts of the Briton kingdoms, from the valleys of Glamorgan to the Isle of Anglesey."
 titular_titles_anglosaxon.0101.desc.body.fallback: "The newly formed [title.GetTierAsNameNoTooltip] lays claim to a considerable region centered on the rising royal centre of [founder_capital.GetNameNoTierNoTooltip]."
 titular_titles_anglosaxon.0101.desc.outro: "\n\nThe unification of [title.GetNameNoTierNoTooltip] marks an watershed moment in the region, as the new and empowered [founder.GetTitledFirstName] is said to have set [founder.GetHerHis] sights on the remaining areas not fully under [founder.GetHerHis] control, and perhaps even beyond. Nearby lords would do well to keep watch on this new rising power in the region."
 titular_titles_anglosaxon.0101.a.new_king: "[WordA_An(title.GetTierAsNameNoTooltip)|U] [title.GetTierAsNameNoTooltip|l] is born!"
 titular_titles_anglosaxon.0101.a.new_king_vassal: "Hail to the [founder.Custom('GetQueenKing')]!"
 titular_titles_anglosaxon.0101.a.anglosaxon: "A potential ally, or a new rival?"
 titular_titles_anglosaxon.0101.a.briton_roman: "This is troubling news..."
 titular_titles_anglosaxon.0101.a: "This is interesting news..."
 
 # Roman events
 titular_titles_roman.0001.t: "The [new_roman_duchy_title.GetNameNoTooltip|U]"
 # Eventually want to make this a lot more dynamic
 titular_titles_roman.0001.desc.intro: "With the reconquest of the region from the barbarian warlords that once claimed the area for themselves, the returning Roman rulers of [new_roman_duchy_title.Custom('title_region_location')] have decreed the restoration of the '[new_roman_duchy_title.GetName]' in the lands they once more now call their own.\n\n"
 titular_titles_roman.0001.desc.fallback: "From this day on, the town of [new_roman_duchy_title.GetPreferredCapital.GetNameNoTierNoTooltip] and the surrounding provinces"
 titular_titles_roman.0001.desc.outro: " will belong 'de jure' to the newly reformed [new_roman_duchy_title.GetTierAsNameNoTooltip]. Any previous claim or birthright will no longer be recognized, and the new Roman rulers will be considered the only rightful lieges of these lands."
 titular_titles_roman.0001.a.roman: "May this land never suffer the rule of barbarians again."
 titular_titles_roman.0001.a.briton: "We'll have to watch this closely..."
 titular_titles_roman.0001.a.anglosaxon: "This is unacceptable!"
 titular_titles_roman.0001.a: "This is interesting news..."
 titular_titles_roman.0002.t: "The [old_roman_duchy_title.Custom('duchy_roman_name_no_tooltip')]"
 titular_titles_roman.0002.desc.intro: "With the reconquest of the region from the Romans that once claimed the area for themselves, the '[old_roman_duchy_title.Custom('duchy_roman_name')]' has been destroyed by the new rulers of the lands that they once called their own.\n\n"
 titular_titles_roman.0002.desc.fallback: "From this day on, the town of [old_roman_duchy_title.GetPreferredCapital.GetNameNoTierNoTooltip] and the surrounding provinces"
 titular_titles_roman.0002.desc.outro: " will belong 'de jure' to their ancient high lordships and kingdoms. Any previous claim or birthright from the former Roman rulers will no longer be recognized, and the new local rulers will be considered the only rightful lieges of these lands."
 titular_titles_roman.0002.a.roman: "This is unacceptable!"
 titular_titles_roman.0002.a.briton: "And again the empire ails..."
 titular_titles_roman.0002.a.anglosaxon: "As it should be."
 titular_titles_roman.0002.a: "This is interesting news..."
 titular_titles_roman.0004.t: "The Province of [title.GetNameNoTierNoTooltip|U]"
 titular_titles_roman.0004.desc.intro: "Having restored vast areas of [title.Custom('title_region_location')] to Roman rule once more, [founder.GetName] has proclaimed the restoration of the Province of [title.GetNameNoTier] from the newly reinstated provincial capital of [title.GetPreferredCapital.GetCountyData.GetCapital.GetBaronyNameExplicitly], reuniting the cities of the region back under their proper administration."
 titular_titles_roman.0004.desc.body.maxima_cesariensis: "\n\nThe newly restored province spans the length of southwestern Britannia, extending outwards from the old diocesan capital of Londinium to cover the valley of the Tamesis and beyond to the ports of Portus Dubris and Rutupiae, as it once did under the empire."
 titular_titles_roman.0004.desc.body.flavia_cesariensis: "\n\nThe newly restored province stretches eastwards from the old territory of the Corielatauvi to span the across the Metaris Aestuarium and cover the marshes of the Fens and the fertile lands of Icenia, as it once did under the empire."
 titular_titles_roman.0004.desc.body.britannia_prima: "\n\nThe newly restored province covers all of the lands from the west, from the cities of the Dobunni south of the Severn to the remote mountains of the Ordovices and the tin-filled hills of the Dumnonii, as it once did under the empire."
 titular_titles_roman.0004.desc.body.britannia_secunda: "\n\nThe newly restored province extends outwards from the great legionary fortress of Eburacum to cover the fertile vale of the Brigantes and extends across the Pennines to include the western coasts of the Setantii, as it once did under the empire."
 titular_titles_roman.0004.desc.body.valentia_extended: "\n\nThe newly restored province spans the length of the Hadrian's Wall as it once did under the empire and now also extends further beyond towards the abandoned Antonine Wall to encompass the northernmost Briton territories never fully under Roman control."
 titular_titles_roman.0004.desc.body.valentia: "\n\nThe newly restored province spans the length of Hadrian's Wall to cover the many reoccupied forts protecting the northern border of Roman Britannia, as it once did under the empire."
 titular_titles_roman.0004.desc.body.fallback: "\n\nThe newly recreated province covers a considerable region stretching from [vassal_duchy_1.GetNameNoTierNoTooltip] to [vassal_duchy_2.GetNameNoTierNoTooltip], as it once did under the empire."
 titular_titles_roman.0004.desc.outro: "The citizens of the province can now rest a little easier in the knowledge that proper Roman rule and administration have been restored to the land, so that it can finally prosper once more."
 titular_titles_roman.0004.a.founder: "The glory of Rome will be restored!"
 titular_titles_roman.0004.a.roman: "Finally, some semblance of order is being restored."
 titular_titles_roman.0004.a.briton: "We can only hope that their promises will ring true."
 titular_titles_roman.0004.a.anglosaxon: "This is troubling news..."
 titular_titles_roman.0004.a: "This is interesting news..."
 
 # Briton events
 titular_titles_briton.0002.t: "The [GetTitleByKey('k_demetia').GetNameNoTooltip|U]"
 titular_titles_briton.0002.desc: "Having expanded beyond the traditional borders of Demetia, [founder.GetTitledFirstNameNicknamedRegnal] has proclaimed the unification of the southern kingdoms of the Cymric mountains into the new [GetTitleByKey('k_demetia').GetName] to better reflect the extent of [founder.GetHerHis] rule.\n\nThis new and expanded kingdom promises to be a strong force in the region, though it remains to be seen how well they will stand up to their more established rivals."
 titular_titles_briton.0002.a.founder: "A good king, a strong kingdom."
 titular_titles_briton.0002.a: "This is interesting news..."
 titular_titles_briton.0004.t: "The Reunification of Dumnonia"
 titular_titles_briton.0004.desc: "The two kingdoms of [GetTitleByKey('k_dumnonia').GetNameNoTier] and [GetTitleByKey('k_kernow').GetNameNoTier], heirs to the old tribe and civitas of the Dumnonii, have once again been reunited in the person of [founder.GetTitledFirstNameNicknamedRegnal]. Eager to cement [founder.GetHerHis] rule, [founder.GetSheHe] has abolished the separation between the kingdoms and declared that the proud Dumnonian peoples will never again be divided.\n\nWith the division of past generations healed, a bulwark rises in the southwest."
 titular_titles_briton.0004.a.founder: "Reunited as one."
 titular_titles_briton.0004.a: "This is interesting news..."
 titular_titles_briton.0006.t: "The [GetTitleByKey('k_strathclyde').GetNameNoTooltip|U]"
 titular_titles_briton.0006.desc: "The Brythonic Old North, once home to an array of proud kings and respected dynasties, have seen better days. Now, the remaining Cumbrians have been united under the rule of [founder.GetTitledFirstNameNicknamedRegnal] of Alt Clut, [founder.GetHerHis] kingdom now becoming increasingly known as [GetTitleByKey('k_strathclyde').GetNameNoTier].\n\nTenacious and steadfast, the men of Alt Clut were renowned for their refusal to bow to foreign rule. Time will tell if this heralds a new era in the Old North, or if this is simply the last gasp of the Cumbrians."
 titular_titles_briton.0006.a.founder: "The Old North is not yet lost!"
 titular_titles_briton.0006.a: "This is interesting news..."
 titular_titles_briton.0008.t: "[GetTitleByKey('e_hen_ogledd').GetNameNoTierNoTooltip|U]"
 titular_titles_briton.0008.desc: "In the northern provinces of Britain, the old united Cumbrian kingdom of '[GetTitleByKey('e_hen_ogledd').GetNameNoTier]', the Old North, has been formed once more under the rule of [founder.GetTitledFirstNameNicknamedRegnal]. [founder.GetHerHis|U] vassals have recognized [founder.GetHerHis] sovereign lordship and proclaimed [founder.GetHerHis] rule in the Great Hall of [founder.GetCapitalLocation.GetNameNoTooltip].\n\nWhile it is said that the Anglo-Saxons of the South are steel, the Men of the North are stone. The true Kings of the North were prophesied to regain their dominion and expand their rule over all of Britannia. Will the unified Cumbrian North be able to repel the Germanic invaders from Britannia once and for all?"
 titular_titles_briton.0008.a.founder: "Coel Hen's kingdom, reunited!"
 titular_titles_briton.0008.a: "This is interesting news..."
 titular_titles_briton.0010.t: "Y Mab Darogan"
 titular_titles_briton.0010.desc: "Britannia was once thought lost, consigned to history by the advance of the Saxons over the divided and squabbling Britons. But in their remaining redoubts, the Britons never quite lost hope, speaking of 'Y Mab Darogan' - the prophesied child - a second Arthur destined to drive the Saxons back into the sea and reclaim Britannia once and for all.\n\nIt has now become clear to all that the prophecy has come to pass. #game_link #ONCLICK:CHARACTER,[founder.GetID] #TOOLTIP:CHARACTER,[founder.GetID] [founder.Custom('GetQueenKing')] [founder.GetFirstNameNoTooltip] of [founder_old_primary.GetNameNoTierNoTooltip]#!#!#! has brought almost all of the old British lands under [founder.GetHerHis] rule and has now been triumpantly crowned as the first [founder.GetTitleAsNameNoTooltip] in generations, proudly claiming the epithet as [founder.GetHerHis] own. A new dawn breaks over Britannia..."
 titular_titles_briton.0010.a.founder: "I am the child of destiny, and Britannia is ours once again!"
 titular_titles_briton.0010.a.briton: "The prophesied one has triumphed!"
 titular_titles_briton.0010.a: "This is interesting news..."
 titular_titles_briton.0013.t: "The [GetTitleByKey('e_cymru').GetNameNoTooltip|U]"
 titular_titles_briton.0013.desc: "With the fall of the east to the Anglo-Saxon invaders, the Britons retreated to the west, eventually left with only the protected hills and secluded valleys of Cymru where they largely remained as divided as ever. Now, [founder.GetTitledFirstNameNicknamedRegnal] has succeeded in uniting the squabbling petty kingdoms of the Britons under his rule and has been crowned High King of [GetTitleByKey('e_cymru').GetNameNoTooltip] in the Great Hall of [founder_capital.GetNameNoTierNoTooltip].\n\nWhile the Anglo-Saxons conquered a Lloegyr divided between feuding warlords, the Britons of Cymru have now been unified under one ruler. Will the Britons have their revenge and drive the Germanic invaders back into the sea?"
 titular_titles_briton.0013.a.founder: "I am High King of the Cymry."
 titular_titles_briton.0013.a.founder_vassal: "Hail to [founder.GetTitledFirstName]!"
 titular_titles_briton.0013.a.briton_roman: "Perhaps there is hope for the Britons?"
 titular_titles_briton.0013.a.anglosaxon: "High King or not, we will still conquer them..."
 titular_titles_briton.0013.a: "This is interesting news..."
 britannia_de_jure_shift_happened_tt: "[GetTitleByKey('e_britannia').GetName] has become [de_jure|E] liege of all Brythonic kingdoms in the region of [GetGeographicalRegion('btwk_world_britannia').GetName]"
 titular_titles_briton.0015.t: "The Fall of $NOVANT$"
 titular_titles_briton.0015.desc: "The armies of [conqueror.GetName] have conquered the lands of $NOVANT$, annexing its provinces into the growing [GetTitleByKey('k_rheged').GetName] that now spans the whole northern coast of the Hibernian Sea. With the fall of their traditional capital in [GetTitleByKey('c_desnes_mor').GetCountyData.GetCapital.GetBaronyNameExplicitlyNoTooltip], the kings of $NOVANT$ have been forced to flee to their holdings in [GetTitleByKey('k_ynys_man').GetNameNoTier] where they continue to be recognized as kings. Though they continue to claim their lost mainland holdings, few believe they have much hope of a successful reconquest against the growing might of [GetTitleByKey('k_rheged').GetNameNoTierNoTooltip]."
 titular_titles_briton.0015.a.conqueror: "Now they know their place."
 titular_titles_briton.0015.a.novant: "We will return..."
 titular_titles_briton.0015.a: "This is interesting news..."
 titular_titles_briton.0017.t: "The Conquest of [GetTitleByKey('d_aeron').GetNameNoTierNoTooltip|U]"
 titular_titles_briton.0017.desc: "Lying between [GetTitleByKey('c_altclut').GetCountyData.GetCapital.GetBaronyNameExplicitlyNoTooltip] and [GetTitleByKey('c_desnes_mor').GetCountyData.GetCapital.GetBaronyNameExplicitlyNoTooltip], [GetTitleByKey('d_aeron').GetNameNoTier] has traditionally been associated with the [GetTitleByKey('k_ynys_man').GetName] but in reality its princes have not had particularly strong ties to either royal centre. That is now changing, however, as [conqueror.GetName] has decided to more forcefully exert [conqueror.GetHerHis] influence down the coast and bring the area more properly under the authority of [GetTitleByKey('k_strathclyde').GetNameNoTier]. While the Kings of [GetTitleByKey('k_ynys_man').GetNameNoTierNoTooltip] protest what they see as an incursion into their traditional territories, their inability to back up their claims have left these complaints falling on deaf ears as the lords of [GetTitleByKey('d_aeron').GetNameNoTierNoTooltip] now pay proper homage north to the Kings of [GetTitleByKey('k_strathclyde').GetNameNoTierNoTooltip]."
 titular_titles_briton.0017.a.conqueror: "Merely an assertion of how it should have been all along."
 titular_titles_briton.0017.a.novant: "This is an outrage!"
 titular_titles_briton.0017.a: "This is interesting news..."
 titular_titles_briton.0019.t: "The $BRITANNIC_EMPIRE$"
 titular_titles_briton.0019.desc: "Beset by waves of barbarians who conquered much of the island and established many kingdoms of their own, the reconquest of Britannia by the Romanized kings who survived its ruin came as a surprise to many. Now, after reunifying the entire province under [founder.GetHerHis] rule, High [founder.Custom('GetQueenKing')] [founder.GetFirstName] has declared that the abandonment of the western provinces by the Emperor in Constantinople has rendered the Imperial title in the West vacant, and as ruler of the last province in the West not to fall to barbarian rule, [founder.GetSheHe] has now proceeded to claim the Imperial crown for [founder.GetHerselfHimself]. Whether the newly crowned [founder.GetTitledFirstName] remains content with [founder.GetHerHis] current realm or seeks to cross the channel to make real [founder.GetHerHis] nominal pretentions over all of the provinces of the former Western half of the Empire, [founder.GetSheHe] has made it clear that this new $BRITANNIC_EMPIRE$ is a power to be reckoned with."
 titular_titles_briton.0019.a.founder: "Long live the restored Empire!"
 titular_titles_briton.0019.a: "This is interesting news..."
 titular_titles_briton.0052.t: "The Ruin of Britannia"
 titular_titles_briton.0052.desc: "The seemingly inexorable advance of the Saxons have driven the remaining British kingdoms to the margins of the island. Most of [GetTitleByKey('e_britannia').GetNameNoTier] now lies under their rule, including most of its greatest cities and richest lands.\n\nWith the post-Roman order on the island now all but dead, the remaining British kingdoms have become increasingly isolated and withdrawn as dreams of pan-British unity give way to more localized concerns. The dream of a strong High King who could finally unite the old province and drive out the hated Saxons is dead, leaving the remaining kings to struggle over the lands that they are now calling '[GetTitleByKey('e_cymru').GetNameNoTier]'."
 titular_titles_briton.0052.desc.other_culture: "The seemingly inexorable advance of the [britannia_largest_controlled_culture.GetCollectiveNounNoTooltip] have driven the remaining British kingdoms to the margins of the island. Most of [GetTitleByKey('e_britannia').GetNameNoTier] now lies under their rule, including many of its richest lands and most important cities.\n\nWith the post-Roman order on the island now all but dead, the remaining British kingdoms have become increasingly isolated and withdrawn as dreams of pan-British unity give way to more localized concerns. The dream of a strong High King who could finally unite the old province and drive out the invaders is dead, leaving the remaining kings to struggle over the lands that they are now calling '[GetTitleByKey('e_cymru').GetNameNoTier]'."
 titular_titles_briton.0052.a.briton: "The spirit of the Britons will never fade!"
 titular_titles_briton.0052.a.roman: "We will never accept the rule of these barbarians!"
 titular_titles_briton.0052.a.anglosaxon: "As Britannia fades, [GetTitleByKey('e_aengland').GetNameNoTierNoTooltip] rises!"
 titular_titles_briton.0052.a.other_germanic: "The Age of the Romans is truly over."
 titular_titles_briton.0052.a: "The legacy of Rome is fading away..."
 britannia_mechanics_disabled_tt: "The High Kingship of [GetTitleByKey('e_britannia').GetNameNoTier] and all associated mechanics have been disabled"
 brythonic_culture_blocked_from_pre_feudal_to_sub_roman: "Independent [GetCulturePillar('heritage_brythonic').GetName] realms can no longer adopt [GetGovernment('sub_roman_government').GetName] directly from [GetGovernment('pre_feudal_government').GetNameNoTooltip]"
 cymru_de_jure_shift_happened_tt: "[GetTitleByKey('e_cymru').GetName] became [de_jure|E] liege of all Brythonic kingdoms in the region of [GetGeographicalRegion('btwk_world_britannia_south').GetName]"
 hen_ogledd_de_jure_shift_happened_tt: "[GetTitleByKey('e_hen_ogledd').GetName] became [de_jure|E] liege of all Brythonic kingdoms in the region of [GetGeographicalRegion('btwk_world_britannia_hen_ogledd').GetName]"
 briton_culture_split_happened_tt: "[briton.GetName] culture has split into [welsh.GetName], [cornish.GetName], and [cumbrian.GetName]"
 armorican_culture_divergence_happened_tt: "All [armorican.GetName] characters and provinces have become [breton.GetName]"
 
 # Irish/Gaelic events
 titular_titles_irish.0002.t: "The [GetTitleByKey('k_lleyn').GetNameNoTooltip|U]"
 titular_titles_irish.0002.desc: "In the far northwestern coasts of Cymru, Irish settlers have long been the bane of the local British kings, with the Kings of [GetTitleByKey('k_gwynedd').GetNameNoTier] failing to properly enforce their claims over the region. Now, the petty lords have been united under the rule of [founder.GetTitledFirstNameNicknamedRegnal] into the new '[GetTitleByKey('k_lleyn').GetName|U]' spanning from the Llyn pennisula to the holy island of Ynys Mon.\n\nAlready known for their fearsome raids across the region, the unification of the Irish of Lleyn has done little to quell fears of a new wave of attacks on the nearby kingdoms. Local lords would do well to reinforce their defenses and prepare for the worst."
 titular_titles_irish.0002.a.founder: "Let all of Britannia fear our raiders!"
 titular_titles_irish.0002.a: "This is interesting news..."
 titular_titles_irish.0004.t: "The Reconquest of [GetTitleByKey('k_lleyn').GetNameNoTierNoTooltip|U]"
 titular_titles_irish.0004.desc: "The Irish [GetTitleByKey('k_lleyn').GetName] in the far northwest of Cymru, long the bane of British kings across the region, has been conquered by the forces of [conqueror.GetName]. The Llyn pennisula and the island of Ynys Mon, long centers of Irish settlement, have been returned to British rule at last.\n\nWhile many settlers still remain and the Irish influence on the region is likely to be felt for many years to come, the fall of Lleyn seemingly puts a definite end to the era of Irish rule in the region. Local lords can now rest a little easier knowing that the ever-present threat posed by Lleyn's fearsome raiders has been eliminated."
 titular_titles_irish.0004.a.conqueror: "$cunedag_male_briton$'s work has been finished!"
 titular_titles_irish.0004.a: "This is interesting news..."
 titular_titles_irish.0006.t: "The [GetTitleByKey('e_cymru').GetNameNoTooltip|U]"
 titular_titles_irish.0006.desc: "Once regarded as mere pirates, the Irish of the western coasts of Britannia eventually became well established in the region and even claimed a number of kingdoms as their own. Though they remained a minority, the Irish settlers proved a match for the divided British kingdoms of [GetGeographicalRegion('btwk_world_britannia_south_cymry').GetName] and now, after establishing [founder.GetHerHis] absolute supremacy over the region, [founder.Custom('GetQueenKing')] [founder.GetFirstName] of [founder_primary_title.GetNameNoTier] has been proclaimed [founder.GetTitleAsNameNoTooltip] - of '[GetTitleByKey('e_cymru').GetNameNoTier]', as [founder.GetSheHe] calls it.\n\nAs High King, [founder.GetFirstName] lays claim to all of southwestern Britannia from Gwynedd to Cornwall, but [founder.GetHerHis] ambitions are claimed to stretch far into the unconquered lands of the east. Newly geminated, the Irish dominion may well not rest until it has united all of Britannia under its rule."
 titular_titles_irish.0006.a.founder: "What the Britons could not do, we shall!"
 titular_titles_irish.0006.a: "This is interesting news..."
 
 # Romanized Germanic events
 titular_titles_romanized_germanic.0002.t: "The Kingdom of $ROMANIZED_GERMANIC_BRITANNIA_KINGDOM_NAME_TOOLTIP$"
 titular_titles_romanized_germanic.0002.desc: "The [founder_kingdom_culture.GetCollectiveNounNoTooltip] of [founder.GetCapitalLocation.GetName] have long been settled in the area, but until recently had generally played only a marginal role in local affairs. That has now changed, however, as under the leadership of [founder.GetTitledFirstName], [founder_kingdom_culture.GetNameNoTooltip] lords have risen to power and seized control of the region from its former Briton rulers.\n\nWhile they remain a minority, the kingdom is quickly becoming associated with its new rulers and has largely become known simply as the 'Kingdom of the [founder_kingdom_culture.GetCollectiveNounNoTooltip]'. Rather than having to choose between the established kingdoms of the Britons and Saxons, it seems that the [founder_kingdom_culture.GetCollectiveNounNoTooltip] of Britannia have decided to forge their own path."
 titular_titles_romanized_germanic.0002.a.founder: "A new home for our people!"
 titular_titles_romanized_germanic.0002.a.former_holder: "How dare they claim our lands as their own!"
 titular_titles_romanized_germanic.0002.a: "This is interesting news..."
 titular_titles_romanized_germanic.0004.t: "[GetTitleByKey('e_romanized_germanic_britannia').GetNameNoTooltip|U]"
 titular_titles_romanized_germanic.0004.desc.founder: "Since the fall of the last Western emperors, there has been little Imperial presence in the former Western provinces of the Empire, with the Eastern court essentially abandoning the western provinces to their fate. It is clear that the Emperor in Constantinople has forfeited his right and claim to rule over the West; meanwhile, our efforts at reuniting the fractured provinces back together has met with great success, with virtually all of Britannia now under our rule. It now falls to us to ensure that Empire in the West lives on, and so, in a grand ceremony in new Imperial capital of [founder_capital.GetNameNoTier], I have now been crowned [founder.GetTitleAsNameNoTooltip] of the restored Empire in the West.\n\nMy assumption of the Imperial crown has been decried by some Romans who assert that no 'barbarian' could ever be emperor, but these claims are easily dismissed - after all, have we not restored order over many former Imperial provinces, and indeed maintained a bastion of Roman culture and civilization with little rival in all of the West? More pressing is the issue of the other kings, who have refused to recognize my title of Emperor and submit to our rightful suzerainty. In time, they will be defeated and the lost provinces of the Empire recovered - [GetTitleByKey('e_romanized_germanic_britannia').GetCollectiveNounNoTooltip|U] and Romans together, we will not stop until we have made a desert and called it peace!"
 titular_titles_romanized_germanic.0004.desc: "Since the fall of the last Western emperors, there has been little Imperial presence in the former Western provinces of the Empire, with Constantinople distant and easily ignored. After unifying much of Britannia under [founder.GetHerHis] rule, however, [founder.Custom('GetQueenKing')] [founder.GetFirstName] of [founder_primary_title.GetNameNoTier] has declared that the abandonment of the western provinces by the Eastern court has rendered the Imperial title in the West vacant and has now proceeded to claim the Imperial crown for [founder.GetHerselfHimself]. While [founder.GetHerHis] claim to the Empire has been decried by many Romans asserting that no barbarian could ever be emperor, few in the realm openly dare to challenge [founder.GetHerHis] legitimacy, and indeed some argue that [founder.GetHerHis] rule over former Imperial provinces and continuing patronage of Roman culture properly justify [founder.GetHerHis] claim.\n\nThe newly proclaimed empire claims pretentions over all of the provinces of the former Western half of the Empire, though it will fall to the newly crowned [founder.GetTitleAsNameNoTooltip] [founder.GetFirstName] to enforce those claims over the kings that already reign over those provinces. The question remains - will the new empire be content with what it has achieved, or will these Romanized "barbarian" emperors only stop like the Romans before them when they have "made a desert and call it peace"?"
 titular_titles_romanized_germanic.0004.a.founder: "Long live the restored Empire!"
 titular_titles_romanized_germanic.0004.a.founder_roman_briton: "Can a barbarian really be emperor?"
 titular_titles_romanized_germanic.0004.a.roman_briton: "No barbarian could truly be emperor!"
 titular_titles_romanized_germanic.0004.a: "A pretentious move."
 titular_titles_romanized_germanic.0004.a.tt: "The [britannia_struggle|E] has ended with [WordA_An(founder.GetCulture.MakeScope.Var('ancestral_non_roman_culture').Culture.GetNameNoTooltip)] #color_blue_gray;bold [founder.GetCulture.MakeScope.Var('ancestral_non_roman_culture').Culture.GetNameNoTooltip] Conquest#!! The [founder.GetCulture.MakeScope.Var('ancestral_non_roman_culture').Culture.GetCollectiveNounNoTooltip] of Britannia have unified the province and made it their own, and have gone on to claim the mantle of Rome for themselves."
 romanized_germanic_britannia_de_jure_shift_happened_tt: "[GetTitleByKey('e_romanized_germanic_britannia').GetName] became [de_jure|E] liege of all Brythonic kingdoms in the region of [GetGeographicalRegion('btwk_world_britannia').GetName]"
 
 # Generic events
 titular_titles.0001.t: "The [new_de_jure_liege_title.GetAdjectiveNoTooltip] Conquest of [region_base_title.MakeScope.Var('kingdom_geographical_region_var').GeographicalRegion.GetNameNoTooltip]"
 titular_titles.0001.desc.intro: "Under the rule of [conqueror.GetTitledFirstName], the armies of [new_de_jure_liege_title.GetNameNoTier] have conquered much of [region_base_title.MakeScope.Var('kingdom_geographical_region_var').GeographicalRegion.GetName] and brought the region under their control."
 titular_titles.0001.desc.cymru: "The rugged west of Britannia, once home to a vast patchwork of Briton kingdoms,"
 titular_titles.0001.desc.lloegyr: "The rich eastern provinces of Britannia centered on the old provincial capital of Londinium"
 titular_titles.0001.desc.hen_ogledd: "From the old city of Ebruacum to well beyond the wall, the northern provinces of Britannia"
 titular_titles.0001.desc.fallback: "The many provinces of the region"
 titular_titles.0001.desc.outro: "now lie firmly under [new_de_jure_liege_title.GetAdjectiveNoTooltip] rule. \n\nWith [conqueror.GetHerHis] authority now firmly cemented, [conqueror.GetTitledFirstName] has officially proclaimed the region's annexation as a core and inviolable part of the [new_de_jure_liege_title.GetName]. Any previous claim or birthright has been completely superseded, and the new [new_de_jure_liege_title.GetAdjectiveNoTooltip] rulers will now be recognized as the only rightful lieges of these lands."
 titular_titles.0001.a.conqueror: "As is only our right."
 titular_titles.0001.a: "This is interesting news..."
l_english:

 BTWK_clerical_titles.0001.t: "The [new_title.GetNameNoTooltip|U]"
 BTWK_clerical_titles.0001.desc.intro: "Under the initiative of [kingdom_holder.GetName], the bishops of [effect_region.GetName] have assembled in a synod to elect one of their number as their new $game_concept_archbishop$."
 BTWK_clerical_titles.0001.desc.roman_britain_circenster_alt_sees: "Following a brief debate, the bishops have decided that it will be the see of [new_title.GetNameNoTier] that will be made the head of their new [new_title.GetTierAsNameNoTooltip], recognizing that the growing importance of its bishops and monastaries greatly overshadows the old but now much reduced metropolis of [GetTitleByKey('d_et_cirencester').GetNameNoTierNoTooltip]."
 BTWK_clerical_titles.0001.desc.roman_britain_sees: "Following a brief debate, the bishops have decided that the see of [new_title.GetNameNoTier] will be raised back to the ancient status of metropolis that it held under the Empire, restoring its traditional jurisdiction over the entirely of the old Roman province."
 BTWK_clerical_titles.0001.desc.anglo_saxon_canterbury: "Following a brief debate, the bishops have decided that it will be [kingdom_holder.GetTitledFirstNamePossessive] capital see of [new_title.GetNameNoTier] that will be made the head of their new [new_title.GetTierAsNameNoTooltip], claiming superiority over all of southern Britannia below the Humber - though the Welsh bishops of the west have refused so far refused to accept [new_title.GetNameNoTierNoTooltip]'s authority."
 BTWK_clerical_titles.0001.desc.anglo_saxon_canterbury_from_outside: "Following a brief debate, the bishops have decided that it will be the see of [new_title.GetNameNoTier], close to the Christian kingdoms of Gaul, that will be made the head of their new [new_title.GetTierAsNameNoTooltip], claiming superiority over all of southern Britannia - though the Welsh bishops of the west have refused so far refused to accept [new_title.GetNameNoTierNoTooltip]'s authority."
 BTWK_clerical_titles.0001.desc.anglo_saxon_york: "Following a brief debate, the bishops have decided that it will be the see of [new_title.GetNameNoTier] that will be made the head of their new [new_title.GetTierAsNameNoTooltip], raising the old Roman city back to its previous status to formally head off the pretensions of [archbishops|U] based in the south."
 BTWK_clerical_titles.0001.desc.anglo_saxon_lindisfarne: "Following a brief debate, the bishops have decided that it will be the see of [new_title.GetNameNoTier] that will be made the head of their new [new_title.GetTierAsNameNoTooltip], relying on the growing prestige of its monastery to formally head off the pretensions of [archbishops|U] based in the south."
 BTWK_clerical_titles.0001.desc.briton_st_davids_canterbury_exists: "Following a brief debate, the bishops have decided that it will be the see of [new_title.GetNameNoTier] that will be made the head of their new [new_title.GetTierAsNameNoTooltip], formally entrenching the liberty of the Welsh church and denying the claims of [GetTitleByKey('d_et_canterbury').MakeScope.Var('clerical_title').Title.GetNameNoTier] to jurisdiction over the dioceses of Wales."
 BTWK_clerical_titles.0001.desc.briton_st_davids: "Following a brief debate, the bishops have decided that it will be the see of [new_title.GetNameNoTier] that will be made the head of their new [new_title.GetTierAsNameNoTooltip], formalizing its claims of primacy over the dioceses of Wales."
 BTWK_clerical_titles.0001.desc.briton_london_w_st_davids: "Following a brief debate, the bishops have decided that sees of southern Britannia will be divided between two $game_concept_archdioceses$, with the see of [new_title.GetNameNoTier] raised back to its the ancient Roman status of metropolis to oversee the east, while the existing [GetTitleByKey('d_et_st_davids').MakeScope.Var('clerical_title').Title.GetName] is expanded to have jurisdiction over the west."
 BTWK_clerical_titles.0001.desc.briton_london: "Following a brief debate, the bishops have decided that the see of [new_title.GetNameNoTier] will be raised back to the ancient status of metropolis that it held under the Empire, with jurisdiction over most of the southeastern provinces of Lloegyr."
 BTWK_clerical_titles.0001.desc.briton_york: "Following a brief debate, the bishops have decided that the see of [new_title.GetNameNoTier] will be raised back to the ancient status of metropolis that it held under the Empire, with jurisdiction over all the provinces of northern Britain."
 BTWK_clerical_titles.0001.desc.fallback: "Following a brief debate, the bishops have decided that it will be the see of [new_title.GetNameNoTier] that will be made the head of their new [new_title.GetTierAsNameNoTooltip]."
 BTWK_clerical_titles.0001.desc.outro.no_religious_head: "This decision has now been officially recognized with the presentation of a pallium to the new [new_ecclesiastical_holder.GetTitledFirstNamePossessive].\n\nFrom this day on, the priests and bishops of the region will answer to the newly invested $game_concept_archbishop$, marking the formalization of an ecclesiastical hierarchy and the proper integration of the Christians of [effect_region.GetName] - a significant step for the growth of the wider [new_ecclesiastical_holder.GetFaith.GetAdjective] church."
 BTWK_clerical_titles.0001.desc.outro: "This decision has now been officially recognized with the new [new_ecclesiastical_holder.GetTitledFirstNamePossessive] receipt of a pallium from [religious_head.GetTitledFirstName] [religious_head.GetHerselfHimself].\n\nFrom this day on, the priests and bishops of the region will answer to the newly invested $game_concept_archbishop$, marking the formalization of an ecclesiastical hierarchy and the proper integration of the Christians of [effect_region.GetName] - a significant step for the growth of the wider [new_ecclesiastical_holder.GetFaith.GetAdjective] church."
 BTWK_clerical_titles.0001.a.canterbury_briton: "What? We will not be submitting to a Saxon bishop!"
 BTWK_clerical_titles.0001.a.same_faith: "Glory to God and his Church!"
 BTWK_clerical_titles.0001.a.other_christian: "Just another heretical metropolitan."
 BTWK_clerical_titles.0001.a.non_christian: "Why do they need so many levels of priests anyways?"
 BTWK_clerical_titles.0001.tt: "[new_ecclesiastical_holder.GetName] has been installed as the head of the new [new_title.GetName], with jurisdiction over the region of [effect_region.GetName]"
 BTWK_clerical_titles.0002.t: "Jurisdiction over [effect_expansion_region.GetNameNoTooltip|U] Resolved"
 BTWK_clerical_titles.0002.desc.intro: "Under the initiative of [expansion_actor.GetName], the bishops of [effect_expansion_region.GetName] have assembled in a synod to resolve the question of the region's ecclesiastical jurisdiction."
 BTWK_clerical_titles.0002.desc.anglo_saxon_canterbury: "Following a brief debate, the bishops have decided to accept the primacy of [clerical_title.GetDefinitiveName], acceding to its longstanding claims of jurisdiction over all the dioceses of Britannia south of the Humber."
 BTWK_clerical_titles.0002.desc.briton_western_mercia: "Following a brief debate, the bishops have decided to accept the longstanding claims of [clerical_title.GetDefinitiveName], proclaiming that as a rightful part of Wales, it is the $game_concept_archbishop$ of [clerical_title.GetNameNoTier] alone who has ancient and rightful jurisdiction over the bishops of the region."
 BTWK_clerical_titles.0002.desc.briton_devon_and_cornwall: "Following a brief debate, the bishops have decided to accept the longstanding claims of [clerical_title.GetDefinitiveName], finally willing to accept submission to its $game_concept_archbishop$ now that the issues of Saxon influence have been resolved."
 BTWK_clerical_titles.0002.desc.briton_london: "Following a brief debate, the bishops have decided to accept the longstanding claims of [clerical_title.GetDefinitiveName], proclaiming that as the old Roman capital and primate see of all Britannia it is [clerical_title.GetNameNoTier] that has the best claim to the sees of the lapsed metropolis of [GetTitleByKey('d_et_lincoln').GetNameNoTierNoTooltip]."
 BTWK_clerical_titles.0002.desc.fallback: "Following a brief debate, the bishops have decided to accept the claims of [clerical_title.GetDefinitiveName], proclaiming that it is the $game_concept_archbishop$ of [clerical_title.GetNameNoTier] alone who has ancient and rightful jurisdiction over the bishops of the region."
 BTWK_clerical_titles.0002.desc.outro.no_religious_head: "This decision has now been officially recognized by the envoys and confirmations of the other bishops and $game_concept_archbishops$ in the region.\n\nFrom this day on, the priests and bishops of the region will be officially made to answer to their newly affirmed $game_concept_archbishop$, marking the formalization of their ecclesiastical hierarchy and the proper integration of the Christians of [effect_expansion_region.GetName] - a significant step for the growth of the wider [ecclesiastical_holder.GetFaith.GetAdjective] church."
 BTWK_clerical_titles.0002.desc.outro: "This decision has now been officially recognized with the arrival of [religious_head.GetTitledFirstNamePossessive] envoys, carrying letters confirming [ecclesiastical_holder.GetTitledFirstNamePossessive] authority over the sees of the region.\n\nFrom this day on, the priests and bishops of the region will be officially made to answer to their newly affirmed $game_concept_archbishop$, marking the formal canonization of their ecclesiastical hierarchy. The proper integration of the Christians of [effect_expansion_region.GetName] into the wider [ecclesiastical_holder.GetFaith.GetAdjective] church has now been done."
 BTWK_clerical_titles.0002.a.expansion_actor: "Finally, [CharICharName(ecclesiastical_holder)] can properly do [CharMyHerHis(ecclesiastical_holder)] work."
 BTWK_clerical_titles.0002.a.same_faith: "This is interesting news..."
 BTWK_clerical_titles.0002.a.other_christian: "Unfortunate, that the heretics are expanding their grasp."
 BTWK_clerical_titles.0002.a.non_christian: "We do not care for the machinations of Christian priests."
 BTWK_clerical_titles.0002.tt: "The region of [effect_expansion_region.GetName] has been placed under the jurisdiction of the [clerical_title.GetName]"
 
l_english:
 BattlePoIHistoricalNameWatlingStreet: "The Battle of Watling Street"
 BattlePoIHistoricalDescWatlingStreet: "#emp Victor: [GetScriptedCharacterByHistoryID( '2372' ).GetFirstName] [GetScriptedCharacterByHistoryID( '2372' ).GetDynastyName]\nDefeated: [GetScriptedCharacterByHistoryID( '3495' ).GetFirstNameNicknamed]\nDate: 61 AD#!\n#weak The final battle of Boudicca's revolt, where the Roman governor Suetonius gathered all of his available forces to meet the Icenian queen's great Briton host in battle. Despite being heavily outnumbered, the disciplined and well-equipped Roman legionnaires proved more than a match for the less well-organized Britons, who were cut down in great numbers as they attempted to flee the field, spelling the end of the rebellion.#!"
 BattlePoIHistoricalNameCrayford: "The Battle of Crayford"
 BattlePoIHistoricalDescCrayford: "#emp Victor: [GetScriptedCharacterByHistoryID( '810' ).GetName]\nDefeated: [GetScriptedCharacterByHistoryID( '1218' ).GetTitledFirstName]\nDate: 457 AD#!\n#weak One of several battles recorded between the Britons and Jutes for control of Kent during the Revolt of Hengist and Horsa. The battle was a decisive defeat for the Britons under High King Vortimer, who suffered many losses and was forced to abandon Kent altogether, allowing for the founding of the first Anglo-Saxon kingdom.#!"
 BattlePoIHistoricalNameMountBaddon: "The Battle of Mount Baddon"
 BattlePoIHistoricalDescMountBaddon: "#emp Victor: [GetScriptedCharacterByHistoryID( '3' ).GetFirstNameNicknamed] [GetScriptedCharacterByHistoryID( '3' ).GetDynastyHouseName]\nDefeated: [GetScriptedCharacterByHistoryID( '80' ).GetTitledFirstName]\nDate: 497 AD#!\n#weak The high point of Aelle's invasion of southern Britain, where the Bretwalda of the Saxons had almost reached the Severn Sea and sought to crush the Briton resistance once and for all. The Briton defenders of Mount Baddon were besieged in their fort until the arrival of Arthur, who charged the besieging army with the cross on his shield and inflicted great slaughter on the Saxons. The scale of the victory was so great that the Saxons did not attempt another invasion for many years, and the island knew peace for a generation afterwards.#!"

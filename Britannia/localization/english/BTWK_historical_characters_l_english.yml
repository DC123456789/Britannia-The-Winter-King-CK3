l_english:
 historical_character.BTWK_augustine_of_canterbury: "Augustine of Canterbury was a 6th-century Roman monk sent by Pope Gregory I to convert the Anglo-Saxons. After arriving in Kent, he won the support of its King Æthelberht and secured the conversion of the kingdom as the first Archbishop of Canterbury. The mission he started would go on to convert the rest of the Anglo-Saxon kingdoms to Christianity over the next several decades, marking the beginnings of the English Church."
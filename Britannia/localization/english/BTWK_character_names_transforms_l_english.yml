l_english:
 # Briton name aesthetics
 culture_aesthetics_naming_briton: "$culture_aesthetics_naming_default$, with $briton$ patronymics"
 
 BRITON_PATRONYM: "[$BRITON_PATRONYM_US_OR_NEXT$]"
 BRITON_PATRONYM_US_OR_NEXT: "SelectLocalization($briton_patronym_us_check$, $briton_patronym_us_genitive$, $BRITON_PATRONYM_OS_OR_NEXT$)"
 BRITON_PATRONYM_OS_OR_NEXT: "SelectLocalization($briton_patronym_os_check$, $briton_patronym_os_genitive$, $BRITON_PATRONYM_IX_OR_NEXT$)"
 BRITON_PATRONYM_IX_OR_NEXT: "SelectLocalization($briton_patronym_ix_check$, $briton_patronym_ix_genitive$, $BRITON_PATRONYM_A_OR_NEXT$)"
 BRITON_PATRONYM_A_OR_NEXT: "SelectLocalization($briton_patronym_a_check$, $briton_patronym_a_genitive$, $BRITON_PATRONYM_R_OR_NEXT$)"
 BRITON_PATRONYM_R_OR_NEXT: "SelectLocalization($briton_patronym_r_check$, $briton_patronym_r_genitive$, '$PATRONYM$')"
 
 briton_patronym_nominative: "TrimBackChars('$PATRONYM$', '#!')"
 briton_patronym_us_check: "Not(Or(EqualTo_string(TrimBackChars($briton_patronym_nominative$, 's'), $briton_patronym_nominative$), EqualTo_string(TrimBackChars(TrimBackChars($briton_patronym_nominative$, 's'), 'u'), TrimBackChars($briton_patronym_nominative$, 's'))))"
 briton_patronym_us_base: "TrimBackChars(TrimBackChars($briton_patronym_nominative$, 's'), 'u')"
 briton_patronym_us_genitive: "Concatenate($briton_patronym_us_base$, 'i#!')"
 briton_patronym_os_check: "Not(Or(EqualTo_string(TrimBackChars($briton_patronym_nominative$, 's'), $briton_patronym_nominative$), EqualTo_string(TrimBackChars(TrimBackChars($briton_patronym_nominative$, 's'), 'o'), TrimBackChars($briton_patronym_nominative$, 's'))))"
 briton_patronym_os_base: "TrimBackChars(TrimBackChars($briton_patronym_nominative$, 's'), 'o')"
 briton_patronym_os_genitive: "Concatenate($briton_patronym_os_base$, 'i#!')"
 briton_patronym_ix_check: "Not(Or(EqualTo_string(TrimBackChars($briton_patronym_nominative$, 'x'), $briton_patronym_nominative$), EqualTo_string(TrimBackChars(TrimBackChars($briton_patronym_nominative$, 'x'), 'i'), TrimBackChars($briton_patronym_nominative$, 'x'))))"
 briton_patronym_ix_base: "TrimBackChars(TrimBackChars($briton_patronym_nominative$, 'x'), 'i')"
 briton_patronym_ix_genitive: "Concatenate($briton_patronym_ix_base$, 'igos#!')"
 briton_patronym_a_check: "Not(EqualTo_string(TrimBackChars($briton_patronym_nominative$, 'a'), $briton_patronym_nominative$))"
 briton_patronym_a_base: "TrimBackChars($briton_patronym_nominative$, 'a')"
 briton_patronym_a_genitive: "Concatenate($briton_patronym_a_base$, 'ae#!')"
 briton_patronym_r_check: "Not(EqualTo_string(TrimBackChars($briton_patronym_nominative$, 'r'), $briton_patronym_nominative$))"
 briton_patronym_r_base: "TrimBackChars($briton_patronym_nominative$, 'r')"
 briton_patronym_r_genitive: "Concatenate($briton_patronym_r_base$, 'ris#!')"
 
 # Patronym
 CHARACTER_FIRST_NAME_PATRONYM_BRITON: "$NAME$ $BRITON_PATRONYM$"
 CHARACTER_TITLED_FIRST_NAME_PATRONYM_BRITON: "$TIER$ $NAME$ $BRITON_PATRONYM$"
 CHARACTER_FIRST_NAME_AND_DYNASTY_PATRONYM_BRITON: "$NAME$ $HOUSE$"
 CHARACTER_NAME_PATRONYM_BRITON: "$TIER$ $NAME$ $BRITON_PATRONYM$ of $TITLE$"
 CHARACTER_FULL_NAME_PATRONYM_BRITON: "$TIER$ $NAME$ $BRITON_PATRONYM$ of $TITLE$"
 CHARACTER_FULL_NAME_UNLANDED_PATRONYM_BRITON: "$NAME$ $BRITON_PATRONYM$ $HOUSE$"
 
 # Nickname + Patronym 
 CHARACTER_FIRST_NAME_NICKNAMED_PATRONYM_BRITON: "$NAME$ $NICK$ $BRITON_PATRONYM$"
 CHARACTER_FIRST_NAME_NICKNAMED_PREFIX_PATRONYM_BRITON: "$NICK$ $NAME$ $BRITON_PATRONYM$"
 CHARACTER_TITLED_FIRST_NAME_NICKNAMED_PREFIX_PATRONYM_BRITON: "$TIER$ $NICK$ $NAME$ $BRITON_PATRONYM$"
 CHARACTER_NAME_NICKNAMED_PREFIX_PATRONYM_BRITON: "$TIER$ $NICK$ $NAME$ $BRITON_PATRONYM$ of $TITLE$"
 CHARACTER_FULL_NAME_NICKNAMED_PREFIX_PATRONYM_BRITON: "$TIER$ $NICK$ $NAME$ $BRITON_PATRONYM$ of $TITLE$"
 CHARACTER_FULL_NAME_UNLANDED_NICKNAMED_PREFIX_PATRONYM_BRITON: "$NICK$ $NAME$ $BRITON_PATRONYM$"

 # _ONLY variants
 CHARACTER_TITLED_FIRST_NAME_ONLY_NICKNAMED_PATRONYM_BRITON: "$CHARACTER_TITLED_FIRST_NAME_NICKNAMED_PATRONYM_BRITON$"
 CHARACTER_FIRST_NAME_ONLY_PATRONYM_BRITON: "$CHARACTER_FIRST_NAME_PATRONYM_BRITON$"
 CHARACTER_TITLED_FIRST_NAME_ONLY_PATRONYM_BRITON: "$CHARACTER_TITLED_FIRST_NAME_PATRONYM_BRITON$"
 CHARACTER_FULL_NAME_ONLY_NICKNAMED_PREFIX_PATRONYM_BRITON: "$CHARACTER_FULL_NAME_NICKNAMED_PREFIX_PATRONYM_BRITON$"
 
 # Gaulish name aesthetics
 culture_aesthetics_naming_gaulish: "$culture_aesthetics_naming_default$, with $gaulish$ patronymics"
 
 GAULISH_PATRONYM: "[$GAULISH_PATRONYM_U_OR_NEXT$]"
 GAULISH_PATRONYM_U_OR_NEXT: "SelectLocalization($gaulish_patronym_u_check$, $gaulish_patronym_u_genitive$, $GAULISH_PATRONYM_OS_OR_NEXT$)"
 GAULISH_PATRONYM_OS_OR_NEXT: "SelectLocalization($gaulish_patronym_os_check$, $gaulish_patronym_os_genitive$, $GAULISH_PATRONYM_US_OR_NEXT$)"
 GAULISH_PATRONYM_US_OR_NEXT: "SelectLocalization($gaulish_patronym_us_check$, $gaulish_patronym_us_genitive$, $GAULISH_PATRONYM_X_OR_NEXT$)"
 GAULISH_PATRONYM_X_OR_NEXT: "SelectLocalization($gaulish_patronym_x_check$, $gaulish_patronym_x_genitive$, $GAULISH_PATRONYM_IS_OR_NEXT$)"
 GAULISH_PATRONYM_IS_OR_NEXT: "SelectLocalization($gaulish_patronym_is_check$, $gaulish_patronym_is_genitive$, $GAULISH_PATRONYM_R_OR_NEXT$)"
 GAULISH_PATRONYM_R_OR_NEXT: "SelectLocalization($gaulish_patronym_r_check$, $gaulish_patronym_r_genitive$, '$PATRONYM$')"
 
 gaulish_patronym_nominative: "TrimBackChars('$PATRONYM$', '#!')"
 gaulish_patronym_u_check: "Not(EqualTo_string(TrimBackChars($gaulish_patronym_nominative$, 'u'), $gaulish_patronym_nominative$))"
 gaulish_patronym_u_base: "TrimBackChars($gaulish_patronym_nominative$, 'u')"
 gaulish_patronym_u_genitive: "Concatenate($gaulish_patronym_u_base$, 'unios#!')"
 gaulish_patronym_os_check: "Not(Or(EqualTo_string(TrimBackChars($gaulish_patronym_nominative$, 's'), $gaulish_patronym_nominative$), EqualTo_string(TrimBackChars(TrimBackChars($gaulish_patronym_nominative$, 's'), 'o'), TrimBackChars($gaulish_patronym_nominative$, 's'))))"
 gaulish_patronym_os_base: "TrimBackChars(TrimBackChars(TrimBackChars($gaulish_patronym_nominative$, 's'), 'o'), 'i')"      # If there is an i at the end of the base, that gets truncatad too
 gaulish_patronym_os_genitive: "Concatenate($gaulish_patronym_os_base$, 'ios#!')"
 gaulish_patronym_us_check: "Not(Or(EqualTo_string(TrimBackChars($gaulish_patronym_nominative$, 's'), $gaulish_patronym_nominative$), EqualTo_string(TrimBackChars(TrimBackChars($gaulish_patronym_nominative$, 's'), 'u'), TrimBackChars($gaulish_patronym_nominative$, 's'))))"
 gaulish_patronym_us_base: "TrimBackChars(TrimBackChars(TrimBackChars($gaulish_patronym_nominative$, 's'), 'u'), 'i')"      # If there is an i at the end of the base, that gets truncatad too
 gaulish_patronym_us_genitive: "Concatenate($gaulish_patronym_us_base$, 'ius#!')"
 gaulish_patronym_x_check: "Not(EqualTo_string(TrimBackChars($gaulish_patronym_nominative$, 'x'), $gaulish_patronym_nominative$))"
 gaulish_patronym_x_base: "TrimBackChars($gaulish_patronym_nominative$, 'x')"
 gaulish_patronym_x_genitive: "Concatenate($gaulish_patronym_x_base$, 'cios#!')"
 gaulish_patronym_is_check: "Not(Or(EqualTo_string(TrimBackChars($gaulish_patronym_nominative$, 's'), $gaulish_patronym_nominative$), EqualTo_string(TrimBackChars(TrimBackChars($gaulish_patronym_nominative$, 's'), 'i'), TrimBackChars($gaulish_patronym_nominative$, 's'))))"
 gaulish_patronym_is_base: "TrimBackChars(TrimBackChars($gaulish_patronym_nominative$, 's'), 'i')"
 gaulish_patronym_is_genitive: "Concatenate($gaulish_patronym_is_base$, 'is#!')"
 gaulish_patronym_r_check: "Not(EqualTo_string(TrimBackChars($gaulish_patronym_nominative$, 'r'), $gaulish_patronym_nominative$))"
 gaulish_patronym_r_base: "TrimBackChars($gaulish_patronym_nominative$, 'r')"
 gaulish_patronym_r_genitive: "Concatenate($briton_patronym_r_base$, 'ris#!')"
 
 # Patronym
 CHARACTER_FIRST_NAME_PATRONYM_GAULISH: "$NAME$ $GAULISH_PATRONYM$"
 CHARACTER_TITLED_FIRST_NAME_PATRONYM_GAULISH: "$TIER$ $NAME$ $GAULISH_PATRONYM$"
 CHARACTER_FIRST_NAME_AND_DYNASTY_PATRONYM_GAULISH: "$NAME$ $HOUSE$"
 CHARACTER_NAME_PATRONYM_GAULISH: "$TIER$ $NAME$ $GAULISH_PATRONYM$ of $TITLE$"
 CHARACTER_FULL_NAME_PATRONYM_GAULISH: "$TIER$ $NAME$ $GAULISH_PATRONYM$ of $TITLE$"
 CHARACTER_FULL_NAME_UNLANDED_PATRONYM_GAULISH: "$NAME$ $GAULISH_PATRONYM$ $HOUSE$"
 
 # Nickname + Patronym 
 CHARACTER_FIRST_NAME_NICKNAMED_PATRONYM_GAULISH: "$NAME$ $NICK$ $GAULISH_PATRONYM$"
 CHARACTER_FIRST_NAME_NICKNAMED_PREFIX_PATRONYM_GAULISH: "$NICK$ $NAME$ $GAULISH_PATRONYM$"
 CHARACTER_TITLED_FIRST_NAME_NICKNAMED_PREFIX_PATRONYM_GAULISH: "$TIER$ $NICK$ $NAME$ $GAULISH_PATRONYM$"
 CHARACTER_NAME_NICKNAMED_PREFIX_PATRONYM_GAULISH: "$TIER$ $NICK$ $NAME$ $GAULISH_PATRONYM$ of $TITLE$"
 CHARACTER_FULL_NAME_NICKNAMED_PREFIX_PATRONYM_GAULISH: "$TIER$ $NICK$ $NAME$ $GAULISH_PATRONYM$ of $TITLE$"
 CHARACTER_FULL_NAME_UNLANDED_NICKNAMED_PREFIX_PATRONYM_GAULISH: "$NICK$ $NAME$ $GAULISH_PATRONYM$"

 # _ONLY variants
 CHARACTER_TITLED_FIRST_NAME_ONLY_NICKNAMED_PATRONYM_GAULISH: "$CHARACTER_TITLED_FIRST_NAME_NICKNAMED_PATRONYM_GAULISH$"
 CHARACTER_FIRST_NAME_ONLY_PATRONYM_GAULISH: "$CHARACTER_FIRST_NAME_PATRONYM_GAULISH$"
 CHARACTER_TITLED_FIRST_NAME_ONLY_PATRONYM_GAULISH: "$CHARACTER_TITLED_FIRST_NAME_PATRONYM_GAULISH$"
 CHARACTER_FULL_NAME_ONLY_NICKNAMED_PREFIX_PATRONYM_GAULISH: "$CHARACTER_FULL_NAME_NICKNAMED_PREFIX_PATRONYM_GAULISH$"
 
 # Roman name aesthetics
 culture_aesthetics_naming_roman: "Nomen dynasty names first when given, otherwise dynasty name last when required"
 
 roman_dynasty_is_nomen: "Not(Or(Or(EqualTo_string(TrimBackChars($roman_dynasty_name$, 's'), $roman_dynasty_name$), EqualTo_string(TrimBackChars(TrimBackChars($roman_dynasty_name$, 's'), 'u'), TrimBackChars($roman_dynasty_name$, 's'))), EqualTo_string(TrimBackChars(TrimBackChars(TrimBackChars($roman_dynasty_name$, 's'), 'u'), 'i'), TrimBackChars(TrimBackChars($roman_dynasty_name$, 's'), 'u'))))"
 roman_dynasty_name: "TrimBackChars('$DYNASTY$', '#!')"
 
 ROMAN_NOMEN: "[SelectLocalization($roman_dynasty_is_nomen$, '$DYNASTY$ ', '')]"
 ROMAN_HOUSE_LAST_NAME: "[SelectLocalization($roman_dynasty_is_nomen$, '', ' $HOUSE$')]"
 
 # Basic name
 CHARACTER_FIRST_NAME_AND_DYNASTY_ROMAN: "$ROMAN_NOMEN$$NAME$$ROMAN_HOUSE_LAST_NAME$"
 CHARACTER_FULL_NAME_ROMAN: "$TIER$ $ROMAN_NOMEN$$NAME$ of $TITLE$"
 CHARACTER_FULL_NAME_UNLANDED_ROMAN: "$ROMAN_NOMEN$$NAME$$ROMAN_HOUSE_LAST_NAME$"

 # Nickname
 CHARACTER_FIRST_NAME_AND_DYNASTY_NICKNAMED_ROMAN: "$ROMAN_NOMEN$$NAME$ '$NICK$'$ROMAN_HOUSE_LAST_NAME$"
 CHARACTER_FULL_NAME_NICKNAMED_ROMAN: "$TIER$ $ROMAN_NOMEN$$NAME$ '$NICK$' of $TITLE$"
 CHARACTER_FULL_NAME_NICKNAMED_PREFIX_ROMAN: "$TIER$ $NICK$ $ROMAN_NOMEN$$NAME$$ROMAN_HOUSE_LAST_NAME$ of $TITLE$"
 CHARACTER_FULL_NAME_UNLANDED_NICKNAMED_ROMAN: "$ROMAN_NOMEN$$NAME$ '$NICK$'$ROMAN_HOUSE_LAST_NAME$"
 CHARACTER_FULL_NAME_UNLANDED_NICKNAMED_PREFIX_ROMAN: "$ROMAN_NOMEN$$NICK$ $NAME$$ROMAN_HOUSE_LAST_NAME$"

 # Patronym
 CHARACTER_FULL_NAME_PATRONYM_ROMAN: "$TIER$ $ROMAN_NOMEN$$NAME$ $PATRONYM$ of $TITLE$"
 CHARACTER_FULL_NAME_UNLANDED_PATRONYM_ROMAN: "$ROMAN_NOMEN$$NAME$ $PATRONYM$$ROMAN_HOUSE_LAST_NAME$"
 
 # Nickname + Patronym 
 CHARACTER_FULL_NAME_NICKNAMED_PATRONYM_ROMAN: "$TIER$ $ROMAN_NOMEN$$NAME$ '$NICK$'$ROMAN_HOUSE_LAST_NAME$ of $TITLE$"
 CHARACTER_FULL_NAME_NICKNAMED_PREFIX_PATRONYM_ROMAN: "$TIER$ $NICK$ $ROMAN_NOMEN$$NAME$ $PATRONYM$ of $TITLE$"
 CHARACTER_FULL_NAME_UNLANDED_NICKNAMED_PATRONYM_ROMAN: "$ROMAN_NOMEN$$NAME$ '$NICK$'$ROMAN_HOUSE_LAST_NAME$ "
 CHARACTER_FULL_NAME_UNLANDED_NICKNAMED_PREFIX_PATRONYM_ROMAN: "$NICK$ $ROMAN_NOMEN$$NAME$ $PATRONYM$"

l_english:
 game_concept_the_christian_church_desc: "The Christian Church is the ecclesiastical body that oversees and guides the followers of Jesus Christ, represented as a [situation|E] that advances through a sequence of [the_christian_church_chapters_short|E].\n\nIts boundaries encompass every [archdiocese|E] in the world; every [christian|E] [ruler|E] of [county|E] rank or higher with any part of their [realm|E] inside an Ecclesiastical Province is a member, be they clergy or secular."
 
 game_concept_archdiocese: "Ecclesiastical Province"
 game_concept_archdioceses: "Ecclesiastical Provinces"
 game_concept_archdiocese_desc: "An Ecclesiastical Province is the [christian|E] form of a [clerical_region|E], an ecclesiastical domain held by an [archbishop|E] through its [clerical_title|E] and seated in a capital [county|E], where a [grand_cathedral|E] may be raised.\n\nA [christian|E] [ruler|E] answers in spiritual matters to the [archbishop|E] of the Ecclesiastical Province that contains their [capital|E] [county|E], and the territory subject to Ecclesiastical Provinces collectively constitutes [the_christian_church|E] [situation|E]."

 game_concept_archbishop: "Metropolitan"
 game_concept_archbishops: "Metropolitans"
 game_concept_archbishop_possessive: "Metropolitan's"
 game_concept_archbishops_possessive: "Metropolitans'"
 game_concept_archbishop_desc: "An Metropolitan is the Christian holder of an [archdiocese|E], a duchy-tier [clerical_title|E] whose [clerical_region|E] may span several [realms|E].\n\nAs the [religious_superior|E] of the [bishops|E] and lesser [clergy|E] within that region, a Metropolitan ranks above an ordinary [bishop|E] and answers in turn to the [head_of_faith|E]."
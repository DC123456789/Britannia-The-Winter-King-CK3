l_english:
 pam_clergy_events.0030.desc: "White smoke proclaims the new [new_pope.GetTitledFirstName] in the center of Rome:\n\n"May the Holy Apostles Peter and Paul, in whose power and authority we trust, intercede for us before the Lord. And may the blessing of Almighty God, the Father, and the Son, and the Holy Spirit, come down on you and remain with you forever."\n\n"Amen.""
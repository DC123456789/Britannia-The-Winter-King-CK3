l_english:
 gdp_trade_good_flavor.3024.t: "The Gentleman's Crystal"
 gdp_trade_good_flavor.3024.desc: "[tgf_connoisseur.GetFirstName|U], a connoisseur of quartz, taps each of my pieces lightly with [tgf_connoisseur.GetHerHis] knife and listens before carefully observing and scratching the crystal's surface. Two [tgf_connoisseur.GetSheHe] sets aside. "Calcspar. Very good calcspar." The rest earns a slow, approving nod.\n\nA [tgf_connoisseur.GetWomanMan] who can tell true from false is worth more than either."
 gdp_trade_good_flavor.3024.a: "Smash the fakes. Name the supplier."
 gdp_trade_good_flavor.3024.b: "Join my company. Your eye is worth wages."
 gdp_trade_good_flavor.3024.c: "Teach me the trick with the knife."
 
 gdp_merchant.4030.desc.jade: "a quartz crystal, cut to fit for rich jewellery.\n\n"
 gdp_merchant.4030.artifact.jade: "Cut Quartz Crystal"
 gdp_merchant.4030.artifact.jade.desc: "A quartz crystal from the markets of the Silk Road, cut to fit for rich jewellery."
 
 
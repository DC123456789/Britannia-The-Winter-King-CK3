l_english:
 trade_category_jewelry_materials_desc: "Rare and exotic raw materials prized for their beauty, including gems, amber, ivory, and quartz. These command high prices and are essential for luxury craftsmanship and religious adornment."
 trade_good_jade: "Quartz"
 trade_good_jade_desc: "A hard, clear and geometric crystal found in cold mountainous regions, with some scholars saying it was formed by permanently freezing ice. It is used mainly in jewellery and can be cut and carved to create attractive patterns."
 trade_good_jade_name: "quartz"
l_english:
 roman_restoration.0005.desc.wre: "Acclaimed by Senate and Army, I have been recognized as the rightful ruler of the Roman Empire in the West. \n\nNo greater honor or responsibility can be bestowed upon a single [ROOT.Char.GetWomanMan]. I must be sure to live up to the expectations of my subjects if I wish to remain in power for long."
 roman_restoration.0005.desc.ere: "Acclaimed by Senate and Army, I have been recognized as the rightful ruler of the Roman Empire in the East. \n\nNo greater honor or responsibility can be bestowed upon a single [ROOT.Char.GetWomanMan]. I must be sure to live up to the expectations of my subjects if I wish to remain in power for long."
 roman_restoration.0005.desc.regular: "Acclaimed by Senate and Army, I have been recognized as the rightful ruler of the [ROOT.Char.GetPrimaryTitle.GetBaseName]. \n\nNo greater honor or responsibility can be bestowed upon a single [ROOT.Char.GetWomanMan]. I must be sure to live up to the expectations of my subjects if I wish to remain in power for long."
 
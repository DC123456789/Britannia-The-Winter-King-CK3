 BTWK_CANNOT_USURP_TITLE_BRITON_KINGDOM_TXT: "\n@warning_icon! #X Cannot usurp a Briton [kingdom|E] if you or your [top_liege|E] are an $unromanized_germanic$ [culture|E], or holds a Roman province or empire title#!"
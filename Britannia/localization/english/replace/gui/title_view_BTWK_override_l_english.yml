l_english:
 USURP_TITLE_TOOLTIP_TITLE:1 "#T Usurp the [TITLE.GetBaseName]#!$BTWK_CANNOT_USURP_TITLE$"
 BTWK_CANNOT_USURP_TITLE: "$BTWK_CANNOT_USURP_TITLE_ANGLO_SAXON_DUCHY$$BTWK_CANNOT_USURP_TITLE_ANGLO_SAXON_KINGDOM$$BTWK_CANNOT_USURP_TITLE_BRITON_DUCHY$$BTWK_CANNOT_USURP_TITLE_BRITON_KINGDOM$"
 BTWK_CANNOT_USURP_TITLE_ANGLO_SAXON_DUCHY: "[SelectLocalization(GetScriptedGui('BTWK_cannot_usurp_title_anglo_saxon_duchy').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('title', TITLE.MakeScope).End), 'BTWK_CANNOT_USURP_TITLE_ANGLO_SAXON_DUCHY_TXT', '')]"
 BTWK_CANNOT_USURP_TITLE_ANGLO_SAXON_DUCHY_TXT: "\n@warning_icon! #X Cannot usurp an Anglo-Saxon [duchy|E] if you and your [top_liege|E] are not an $unromanized_germanic$ [culture|E]#!"
 BTWK_CANNOT_USURP_TITLE_ANGLO_SAXON_KINGDOM: "[SelectLocalization(GetScriptedGui('BTWK_cannot_usurp_title_anglo_saxon_kingdom').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('title', TITLE.MakeScope).End), 'BTWK_CANNOT_USURP_TITLE_ANGLO_SAXON_KINGDOM_TXT', '')]"
 BTWK_CANNOT_USURP_TITLE_ANGLO_SAXON_KINGDOM_TXT: "\n@warning_icon! #X Cannot usurp an Anglo-Saxon [kingdom|E] if you and your [top_liege|E] are not an $unromanized_germanic$ [culture|E]#!"
 BTWK_CANNOT_USURP_TITLE_BRITON_DUCHY: "[SelectLocalization(GetScriptedGui('BTWK_cannot_usurp_title_briton_duchy').IsValid(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('title', TITLE.MakeScope).End), 'BTWK_CANNOT_USURP_TITLE_BRITON_DUCHY_TXT', '')]"
 BTWK_CANNOT_USURP_TITLE_BRITON_DUCHY_TXT: "\n@warning_icon! #X Cannot usurp a Briton [duchy|E] if you or your [top_liege|E] are an $unromanized_germanic$ [culture|E]#!"

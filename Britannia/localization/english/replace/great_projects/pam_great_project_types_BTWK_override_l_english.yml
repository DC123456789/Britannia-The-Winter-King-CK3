l_english:
 great_project_type_pam_cathedral_01_desc: "Set the gleaming cross atop firm stone walls, above grand halls and stately naves! Bring the wondrous light of Heaven to Earth, and have it shine on a holy prelate's throne and altar.\n\nAfter years of noble toil, a great beacon will shine out to worshipers near and far." 

 great_project_type_pam_cathedral_02_desc: "Let high towers climb and stately domes span across the sky!\n\nLike a Lazarus, this noble cathedral will be born anew, there to lead us into a new age."

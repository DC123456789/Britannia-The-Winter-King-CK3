 ambrosian_rite: "Cisalpine Rite"
 ambrosian_rite_adj: "Cisalpine Rite"
 ambrosian_rite_adherent: "Cisalpine Christian"
 ambrosian_rite_adherent_plural: "Cisalpine Christians"
 ambrosian_rite_desc: "Properly a number of closely related rites centered around the great metropolitan sees of Milan, Aquileia, and Ravenna, the Cisalpine Rite owes its origins and popularity to the great bishop St. Ambrose of Milan, maintaining its own liturgy and chant and a theological tradition that prizes the thought of St. Augustine of Hippo."


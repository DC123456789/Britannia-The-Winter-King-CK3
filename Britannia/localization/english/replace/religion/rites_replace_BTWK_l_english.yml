 carolingian_christianity_adherent: "Gallican Christian"
 carolingian_christianity_adherent_plural: "Gallican Christians"
 carolingian_christianity_desc: "A form of Christianity that developed in the provinces of Roman Gaul, characterized by its emphasis on monasticism and missionary work."
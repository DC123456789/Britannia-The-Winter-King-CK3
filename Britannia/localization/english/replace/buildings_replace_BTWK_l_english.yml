 building_type_hadrians_wall_01:0 "Hadrian's Wall - Ruined"
 building_type_hadrians_wall_01_desc:0 "$hadrians_wall_base$ \n\nThe wall has since been mostly demolished for building materials, used for developing the local lands, and thus no longer serves as the defensive frontier it once was."
 building_hadrians_wall_01:0 "Hadrian's Wall - Ruined"
 building_hadrians_wall_01_desc:0 "$building_type_hadrians_wall_01_desc$"

 building_type_offas_dyke_01:0 "Mercian Dyke"
 building_type_offas_dyke_01_desc:0 "The #italic Mercian Dyke#! is an embankment on the Mercian border with Wales, designed to provide greater defence against attacks and raids from the Britons (or #italic Wealas#!) who still reside in the western reaches of the isle."
 building_offas_dyke_01:0 "$building_type_offas_dyke_01$"
 building_offas_dyke_01_desc:0 "$building_type_offas_dyke_01_desc$"
 
 building_great_project_cathedral_01: "Early Grand Cathedral"
 building_great_project_cathedral_01_desc: "An early standing cathedral, seat of a bishop and a beacon for Christian pilgrims. In grand halls and shadowed crypts, sacred relics and altars await the faithful.\n\n[building|E] Effects: [GetDomicileBuilding('ecclesiastical_domicile_main_02').GetName] in [cathedral_complex|E]"
 building_great_project_cathedral_02: "Romanesque Grand Cathedral"
 building_great_project_cathedral_02_desc: "Built on the legacy of the venerable [GetBuilding('great_project_cathedral_01').GetName], imposing walls and ascending towers mark a rise to new heights of strength and grandeur. Rounded arches and stately vaults crown a church reborn in the sensibilities of a new age.\n\n[building|E] Effects: [GetDomicileBuilding('ecclesiastical_domicile_main_03').GetName] in [cathedral_complex|E]"
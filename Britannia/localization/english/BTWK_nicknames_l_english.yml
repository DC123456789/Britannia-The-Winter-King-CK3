 nick_y_mab_darogan: "Y Mab Darogan"
 nick_y_mab_darogan_desc: "In their darkest hour, the Britons spoke of a 'Child of Prophecy' who would reclaim [GetTitleByKey('e_britannia').GetNameNoTier] for the Britons and throw the Saxons back into the sea - and indeed, now [CharYouSheHe(CHARACTER)] [CharHaveHas(CHARACTER)]."
 nick_wledig: "Wledig"
 nick_wledig_desc: "A traditional Briton epithet given to a number of heroes and founding figures of kingdoms or dynasties from around the time of the Roman withdrawal."
 nick_wledig_britannia: "$nick_wledig$"
 nick_wledig_britannia_desc: "A Briton epithet given traditionally given to a number of heroes and founding figures of kingdoms or dynasties from around the time of the Roman withdrawal, it seems only fitting that the unifier of Britannia itself also be known as #italic Gwledig#!."
 
